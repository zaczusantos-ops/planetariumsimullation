<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Player Cardboard VR 360° - Fusão Óptica Perfeita</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      width: 100vw;
      height: 100vh;
    }
    #container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(4, 8, 16, 0.95);
      color: white;
      z-index: 999;
      text-align: center;
      padding: 24px;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 8px;
      color: #00f0ff;
    }
    p {
      font-size: 14px;
      max-width: 440px;
      line-height: 1.5;
      color: #c0d0e0;
      margin-bottom: 20px;
    }
    .badge {
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid #00f0ff;
      color: #00f0ff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .btn {
      background: linear-gradient(135deg, #00d2ff, #0066ff);
      color: white;
      border: none;
      padding: 16px 36px;
      font-size: 17px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 150, 255, 0.5);
      transition: all 0.2s ease;
      margin-bottom: 15px;
    }
    .btn:active { transform: scale(0.96); }
    .btn-back {
      background: transparent;
      border: 1px solid #4b5563;
      color: #9ca3af;
      padding: 8px 18px;
      font-size: 13px;
      border-radius: 20px;
      text-decoration: none;
    }
    
    /* Molduras das Lentes Cardboard */
    .eye-frame {
      position: absolute;
      top: 0;
      width: 50vw;
      height: 100vh;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
    }
    #left-eye-frame { left: 0; }
    #right-eye-frame { left: 50vw; }

    .lens-cutout {
      width: min(44vw, 86vh);
      height: min(44vw, 86vh);
      border-radius: 50px;
      box-shadow: 0 0 0 9999px #000000;
      border: 2px solid rgba(0, 240, 255, 0.3);
    }

    #divider-line {
      position: absolute;
      left: 50%;
      top: 0;
      width: 4px;
      height: 100%;
      background: #000;
      transform: translateX(-50%);
      z-index: 15;
      pointer-events: none;
      display: none;
    }

    /* Painel de Calibração de Convergência Óptica */
    #calib-panel {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      z-index: 100;
      background: rgba(10, 15, 25, 0.92);
      border: 1px solid #00f0ff;
      border-radius: 30px;
      padding: 8px 22px;
      align-items: center;
      gap: 16px;
      color: #00f0ff;
      font-size: 13px;
      font-weight: bold;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.9);
    }
    .adj-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .adj-btn {
      background: rgba(0, 240, 255, 0.25);
      border: 1px solid #00f0ff;
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .adj-btn:active { background: rgba(0, 240, 255, 0.7); }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="container"></div>

  <!-- Moldura das Lentes -->
  <div id="left-eye-frame" class="eye-frame">
    <div id="lens-left" class="lens-cutout"></div>
  </div>
  <div id="right-eye-frame" class="eye-frame">
    <div id="lens-right" class="lens-cutout"></div>
  </div>

  <div id="divider-line"></div>

  <!-- Botões de Unificação das Linhas em Tempo Real -->
  <div id="calib-panel">
    <div class="adj-group">
      <span>Unificar Linhas:</span>
      <button id="btn-shift-in" class="adj-btn">◀ Unir Mais</button>
      <span id="shift-val">50px</span>
      <button id="btn-shift-out" class="adj-btn">Separar ▶</button>
    </div>
  </div>

  <div id="ui-overlay">
    <div class="badge">🥽 COMPENSAÇÃO DE DISTÂNCIA INTERPUPILAR</div>
    <h1 id="sim-title">Quando o segundo Sol chegar...</h1>
    <p>
      O player aplica a <strong>compensação de convergência óptica Cardboard</strong> para fundir as duas imagens em uma única linha meridiana centralizada.
    </p>
    <button id="start-btn" class="btn">👓 ENTRAR NO CARDBOARD</button>
    <br>
    <a href="index.html" class="btn-back">⬅ Voltar ao Hub</a>
  </div>

  <video id="video-source" loop crossOrigin="anonymous" playsinline webkit-playsinline style="display:none;">
    <source src="output_videos/quando_o_segundo_sol_chegar_VR360.mp4" type="video/mp4">
  </video>

  <script>
    let scene, camera, renderer, video, texture, mesh;
    let isVR = false;
    let hasOrientation = false;
    let deviceOrientation = { alpha: 0, beta: 0, gamma: 0 };
    let screenOrientation = 0;

    // Deslocamento de convergência óptica para casar com a distância interpupilar (IPD ~63mm)
    // Em telas de 6"+, deslocar ~50px para dentro traz a distância de 78mm para 63mm exatos!
    let eyeShiftPixels = 50; 

    const startBtn = document.getElementById('start-btn');
    const uiOverlay = document.getElementById('ui-overlay');
    const leftEyeFrame = document.getElementById('left-eye-frame');
    const rightEyeFrame = document.getElementById('right-eye-frame');
    const dividerLine = document.getElementById('divider-line');
    const calibPanel = document.getElementById('calib-panel');
    const shiftVal = document.getElementById('shift-val');
    const btnShiftIn = document.getElementById('btn-shift-in');
    const btnShiftOut = document.getElementById('btn-shift-out');
    video = document.getElementById('video-source');

    btnShiftIn.addEventListener('click', (e) => {
      e.stopPropagation();
      eyeShiftPixels += 6;
      shiftVal.textContent = eyeShiftPixels + 'px';
    });

    btnShiftOut.addEventListener('click', (e) => {
      e.stopPropagation();
      eyeShiftPixels = Math.max(0, eyeShiftPixels - 6);
      shiftVal.textContent = eyeShiftPixels + 'px';
    });

    function init() {
      const container = document.getElementById('container');
      
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.autoClear = false;
      container.appendChild(renderer.domElement);

      texture = new THREE.VideoTexture(video);
      texture.generateMipmaps = false;
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.format = THREE.RGBFormat;

      const geometry = new THREE.SphereGeometry(500, 64, 48);
      geometry.scale(-1, 1, 1);
      const material = new THREE.MeshBasicMaterial({ map: texture });
      mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);

      setupTouchControls();
      window.addEventListener('resize', onWindowResize);
      window.addEventListener('orientationchange', () => { screenOrientation = window.orientation || 0; });
      screenOrientation = window.orientation || 0;
    }

    function requestMotionPermission() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(state => {
          if (state === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation, true);
            hasOrientation = true;
          }
        }).catch(console.error);
      } else if ('DeviceOrientationEvent' in window) {
        window.addEventListener('deviceorientation', handleOrientation, true);
        hasOrientation = true;
      }
    }

    function handleOrientation(e) {
      if (e.alpha !== null && e.beta !== null && e.gamma !== null) {
        hasOrientation = true;
        deviceOrientation.alpha = e.alpha;
        deviceOrientation.beta = e.beta;
        deviceOrientation.gamma = e.gamma;
      }
    }

    const zee = new THREE.Vector3(0, 0, 1);
    const euler = new THREE.Euler();
    const q0 = new THREE.Quaternion();
    const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));

    function updateCamera() {
      if (hasOrientation && (deviceOrientation.alpha || deviceOrientation.beta || deviceOrientation.gamma)) {
        const alpha = THREE.MathUtils.degToRad(deviceOrientation.alpha);
        const beta = THREE.MathUtils.degToRad(deviceOrientation.beta);
        const gamma = THREE.MathUtils.degToRad(deviceOrientation.gamma);
        const orient = THREE.MathUtils.degToRad(screenOrientation);

        euler.set(beta, alpha, -gamma, 'YXZ');
        camera.quaternion.setFromEuler(euler);
        camera.quaternion.multiply(q1);
        camera.quaternion.multiply(q0.setFromAxisAngle(zee, -orient));
      } else {
        lat = Math.max(-85, Math.min(85, lat));
        phi = THREE.MathUtils.degToRad(90 - lat);
        theta = THREE.MathUtils.degToRad(lon);
        const target = new THREE.Vector3();
        target.x = Math.sin(phi) * Math.cos(theta);
        target.y = Math.cos(phi);
        target.z = Math.sin(phi) * Math.sin(theta);
        camera.lookAt(target);
      }
    }

    let lon = 0, lat = 0, phi = 0, theta = 0;
    let touchStartX = 0, touchStartY = 0;

    function setupTouchControls() {
      let isDragging = false;
      window.addEventListener('mousedown', e => { 
        if (e.target.tagName === 'BUTTON' || e.target.tagName === 'A') return;
        isDragging = true; touchStartX = e.clientX; touchStartY = e.clientY; 
      });
      window.addEventListener('mousemove', e => {
        if (isDragging) {
          lon -= (e.clientX - touchStartX) * 0.2;
          lat += (e.clientY - touchStartY) * 0.2;
          touchStartX = e.clientX; touchStartY = e.clientY;
        }
      });
      window.addEventListener('mouseup', () => isDragging = false);

      window.addEventListener('touchstart', e => {
        if (e.target.tagName === 'BUTTON' || e.target.tagName === 'A') return;
        if (e.touches.length === 1) {
          touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
        }
      });
      window.addEventListener('touchmove', e => {
        if (e.target.tagName === 'BUTTON' || e.target.tagName === 'A') return;
        if (e.touches.length === 1 && !hasOrientation) {
          lon -= (e.touches[0].clientX - touchStartX) * 0.25;
          lat += (e.touches[0].clientY - touchStartY) * 0.25;
          touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
        }
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      updateCamera();

      if (isVR) {
        const width = window.innerWidth;
        const height = window.innerHeight;
        const halfWidth = width / 2;

        camera.aspect = halfWidth / height;
        camera.updateProjectionMatrix();

        // 1. Olho Esquerdo: Deslocado 'eyeShiftPixels' para a direita (em direção ao centro)
        renderer.setViewport(0 + eyeShiftPixels, 0, halfWidth, height);
        renderer.setScissor(0, 0, halfWidth, height);
        renderer.setScissorTest(true);
        renderer.render(scene, camera);

        // 2. Olho Direito: Deslocado 'eyeShiftPixels' para a esquerda (em direção ao centro)
        renderer.setViewport(halfWidth - eyeShiftPixels, 0, halfWidth, height);
        renderer.setScissor(halfWidth, 0, halfWidth, height);
        renderer.setScissorTest(true);
        renderer.render(scene, camera);
      } else {
        renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
        renderer.setScissorTest(false);
        renderer.render(scene, camera);
      }
    }

    startBtn.addEventListener('click', () => {
      isVR = true;
      uiOverlay.style.display = 'none';
      leftEyeFrame.style.display = 'flex';
      rightEyeFrame.style.display = 'flex';
      dividerLine.style.display = 'block';
      calibPanel.style.display = 'flex';

      video.play().catch(e => console.log("Play error:", e));
      requestMotionPermission();

      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else if (document.documentElement.webkitRequestFullscreen) {
        document.documentElement.webkitRequestFullscreen();
      }

      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
    });

    init();
    animate();
  </script>
</body>
</html>
