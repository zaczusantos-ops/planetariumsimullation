<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Simulação VR 360° - Planetário IOAA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      width: 100vw;
      height: 100vh;
    }
    #container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(4, 8, 16, 0.95);
      color: white;
      z-index: 999;
      text-align: center;
      padding: 24px;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 8px;
      color: #00f0ff;
    }
    p {
      font-size: 14px;
      max-width: 440px;
      line-height: 1.5;
      color: #c0d0e0;
      margin-bottom: 20px;
    }
    .badge {
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid #00f0ff;
      color: #00f0ff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .btn {
      background: linear-gradient(135deg, #00d2ff, #0066ff);
      color: white;
      border: none;
      padding: 16px 36px;
      font-size: 17px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 150, 255, 0.5);
      transition: all 0.2s ease;
      margin-bottom: 15px;
    }
    .btn:active { transform: scale(0.96); }
    .btn-back {
      background: transparent;
      border: 1px solid #4b5563;
      color: #9ca3af;
      padding: 8px 18px;
      font-size: 13px;
      border-radius: 20px;
      text-decoration: none;
    }
    
    /* Moldura das Lentes Cardboard (Sem nenhum botão em cima) */
    .eye-frame {
      position: absolute;
      top: 0;
      width: 50vw;
      height: 100vh;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
    }
    #left-eye-frame { left: 0; }
    #right-eye-frame { right: 0; }

    .lens-mask {
      border: 3px solid rgba(0, 240, 255, 0.4);
      border-radius: 28px;
      box-shadow: 0 0 0 9999px #000;
      position: relative;
    }
    
    .divider {
      position: absolute;
      left: 50%;
      top: 0;
      width: 2px;
      height: 100%;
      background: #111;
      transform: translateX(-50%);
      z-index: 20;
      display: none;
    }

    #quick-back-btn {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 1000;
      background: rgba(10, 15, 25, 0.8);
      border: 1px solid rgba(0, 240, 255, 0.4);
      color: #00f0ff;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      text-decoration: none;
      display: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <a id="quick-back-btn" href="index.html">✕ Sair do VR</a>

  <div id="ui-overlay">
    <div id="sim-badge" class="badge">PROVAS OFICIAIS • CATÁLOGO REAL HYG</div>
    <h1 id="sim-title">Simulação VR 360°</h1>
    <p id="sim-desc">
      Gire a tela para o modo paisagem (horizontal) e encaixe seu smartphone no Google Cardboard / Óculos VR para imersão astronômica completa.
    </p>
    <button class="btn" id="start-btn">ENTRAR NO VR (CARDBOARD)</button>
    <a class="btn-back" href="index.html">← Voltar ao Catálogo de Simulações</a>
  </div>

  <div id="divider-line" class="divider"></div>

  <!-- Máscaras de Abertura Óptica das Lentes -->
  <div id="left-eye-frame" class="eye-frame">
    <div id="lens-left" class="lens-mask"></div>
  </div>
  <div id="right-eye-frame" class="eye-frame">
    <div id="lens-right" class="lens-mask"></div>
  </div>

  <div id="container"></div>

  <video id="video-source" loop playsinline webkit-playsinline crossOrigin="anonymous" style="display:none">
    <source id="video-src" src="output_videos/ioaa2019_p1_keszthely_VR360.mp4" type="video/mp4">
  </video>

  <script>
    // Catálogo de Simulações
    const SIM_DATABASE = {
      'ioaa2019_p1': {
        title: 'IOAA 2019 • Problema 1: Céu de Keszthely',
        badge: '🇭🇺 IOAA 2019 • HUNGARY ROUND 1',
        desc: 'Céu à meia-noite em Keszthely (LST = 01h 00m) com γ Cassiopeiae no meridiano, 3 novas de 2ª magnitude e os 8 aglomerados de Messier.',
        video: 'output_videos/ioaa2019_p1_keszthely_VR360.mp4'
      },
      'ioaa2019_p2': {
        title: 'IOAA • Desafio: Descubra a Latitude do Observador',
        badge: '🧭 DESAFIO DE LATITUDE (CÉU REAL)',
        desc: 'Localize o polo celeste visível e meça sua altitude angular acima do horizonte para descobrir a latitude e o hemisfério exatos deste local!',
        video: 'output_videos/ioaa2019_p2_latitude25s_VR360.mp4'
      },
      'ioaa2019_p3': {
        title: 'IOAA 2019 • Problema 3: Eclipse na Lua',
        badge: '🌕 IOAA 2019 • HUNGARY ROUND 3',
        desc: 'Observador em Mare Fecunditatis (0°, 50° E) vendo a Terra ocultar centralmente o Sol a 40° de altitude a Oeste, com Juno a 3 UA do Sol.',
        video: 'output_videos/ioaa2019_p3_lunar_eclipse_VR360.mp4'
      },
      'quando_o_segundo_sol_chegar': {
        title: 'Quando o segundo Sol chegar...',
        badge: '🪐 SISTEMA BINÁRIO SINCRONIZADO',
        desc: 'Planeta em rotação síncrona com sistema binário peculiar (Plo-I e Plo-II). As duas estrelas e o Centro de Massa oscilam sobre o meridiano local.',
        video: 'output_videos/quando_o_segundo_sol_chegar_VR360.mp4'
      }
    };

    // Obter parâmetro da URL
    const urlParams = new URLSearchParams(window.location.search);
    const simKey = urlParams.get('sim') || 'ioaa2019_p1';
    const isCustom = simKey === 'custom' || urlParams.has('custom_id') || urlParams.has('lat');

    let currentSim = SIM_DATABASE[simKey] || SIM_DATABASE['ioaa2019_p1'];

    if (isCustom) {
      const customLat = parseFloat(urlParams.get('lat') || '-23.5');
      const customLst = parseFloat(urlParams.get('lst') || '12');
      const customBortle = parseInt(urlParams.get('bortle') || '2');
      const customTarget = urlParams.get('target') || 'none';

      currentSim = {
        title: 'Simulação Personalizada (Maker Studio)',
        badge: `🧪 MAKER STUDIO • LAT ${customLat}° • BORTLE ${customBortle}`,
        desc: `Céu customizado: Latitude ${customLat}°, LST ${customLst}h. Observe o domo celeste em 360° e resolva o desafio!`,
        video: 'output_videos/ioaa2019_p2_latitude25s_VR360.mp4',
        lat: customLat,
        lst: customLst,
        bortle: customBortle,
        target: customTarget
      };
    }

    document.getElementById('sim-title').textContent = currentSim.title;
    document.getElementById('sim-badge').textContent = currentSim.badge;
    document.getElementById('sim-desc').textContent = currentSim.desc;
    document.getElementById('video-src').src = currentSim.video;

    let scene, camera, renderer, video, texture, mesh;
    let isVR = false;
    let hasOrientation = false;
    let deviceOrientation = { alpha: 0, beta: 0, gamma: 0 };
    let screenOrientation = 0;

    // Carregar configurações de calibração salvas no Hub
    let eyeShiftPixels = parseInt(localStorage.getItem('cardboard_shift') || '50');
    let lensSizePercent = parseInt(localStorage.getItem('cardboard_size') || '86');

    const startBtn = document.getElementById('start-btn');
    const uiOverlay = document.getElementById('ui-overlay');
    const leftEyeFrame = document.getElementById('left-eye-frame');
    const rightEyeFrame = document.getElementById('right-eye-frame');
    const lensLeft = document.getElementById('lens-left');
    const lensRight = document.getElementById('lens-right');
    const dividerLine = document.getElementById('divider-line');
    const quickBackBtn = document.getElementById('quick-back-btn');
    video = document.getElementById('video-source');
    video.load();

    function applyCalibratedStyle() {
      const sizeVal = `min(${lensSizePercent * 0.5}vw, ${lensSizePercent}vh)`;
      lensLeft.style.width = sizeVal;
      lensLeft.style.height = sizeVal;
      lensRight.style.width = sizeVal;
      lensRight.style.height = sizeVal;
    }

    function init() {
      const container = document.getElementById('container');
      
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.autoClear = false;
      container.appendChild(renderer.domElement);

      texture = new THREE.VideoTexture(video);
      texture.generateMipmaps = false;
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.format = THREE.RGBFormat;

      const geometry = new THREE.SphereGeometry(500, 64, 48);
      geometry.scale(-1, 1, 1);

      const material = new THREE.MeshBasicMaterial({ map: texture });
      mesh = new THREE.Mesh(geometry, material);
      mesh.rotation.y = -Math.PI / 2;
      scene.add(mesh);

      // Suporte a Giroscópio
      window.addEventListener('deviceorientation', handleOrientation, true);
      window.addEventListener('orientationchange', handleScreenOrientation, false);
      handleScreenOrientation();

      // Suporte a Mouse / Touch para Desktop
      let isUserInteracting = false;
      let onPointerDownPointerX = 0, onPointerDownPointerY = 0;
      let lon = 0, onPointerDownLon = 0;
      let lat = 0, onPointerDownLat = 0;
      let phi = 0, theta = 0;

      container.addEventListener('pointerdown', function(e) {
        if (hasOrientation) return;
        isUserInteracting = true;
        onPointerDownPointerX = e.clientX;
        onPointerDownPointerY = e.clientY;
        onPointerDownLon = lon;
        onPointerDownLat = lat;
      });

      document.addEventListener('pointermove', function(e) {
        if (!isUserInteracting || hasOrientation) return;
        lon = (onPointerDownPointerX - e.clientX) * 0.15 + onPointerDownLon;
        lat = (e.clientY - onPointerDownPointerY) * 0.15 + onPointerDownLat;
      });

      document.addEventListener('pointerup', function() { isUserInteracting = false; });

      window.addEventListener('resize', onWindowResize, false);

      startBtn.addEventListener('click', () => {
        uiOverlay.style.display = 'none';
        leftEyeFrame.style.display = 'flex';
        rightEyeFrame.style.display = 'flex';
        dividerLine.style.display = 'block';
        quickBackBtn.style.display = 'block';
        isVR = true;

        applyCalibratedStyle();

        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else if (document.documentElement.webkitRequestFullscreen) {
          document.documentElement.webkitRequestFullscreen();
        }

        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(() => {});
        }

        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission()
            .then(state => {
              if (state === 'granted') {
                window.addEventListener('deviceorientation', handleOrientation, true);
              }
            }).catch(console.error);
        }

        video.play().catch(e => console.log("Erro ao tocar vídeo:", e));
      });

      function animate() {
        requestAnimationFrame(animate);

        if (hasOrientation) {
          updateCameraFromOrientation();
        } else {
          lat = Math.max(-85, Math.min(85, lat));
          phi = THREE.MathUtils.degToRad(90 - lat);
          theta = THREE.MathUtils.degToRad(lon);

          const target = new THREE.Vector3();
          target.x = 500 * Math.sin(phi) * Math.cos(theta);
          target.y = 500 * Math.cos(phi);
          target.z = 500 * Math.sin(phi) * Math.sin(theta);
          camera.lookAt(target);
        }

        renderVR();
      }

      animate();
    }

    function handleOrientation(e) {
      if (e.alpha !== null && e.beta !== null && e.gamma !== null) {
        hasOrientation = true;
        deviceOrientation = {
          alpha: THREE.MathUtils.degToRad(e.alpha || 0),
          beta: THREE.MathUtils.degToRad(e.beta || 0),
          gamma: THREE.MathUtils.degToRad(e.gamma || 0)
        };
      }
    }

    function handleScreenOrientation() {
      screenOrientation = THREE.MathUtils.degToRad(window.orientation || 0);
    }

    const zee = new THREE.Vector3(0, 0, 1);
    const euler = new THREE.Euler();
    const q0 = new THREE.Quaternion();
    const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));

    function updateCameraFromOrientation() {
      const alpha = deviceOrientation.alpha;
      const beta = deviceOrientation.beta;
      const gamma = deviceOrientation.gamma;
      const orient = screenOrientation;

      euler.set(beta, alpha, -gamma, 'YXZ');
      camera.quaternion.setFromEuler(euler);
      camera.quaternion.multiply(q1);
      camera.quaternion.multiply(q0.setFromAxisAngle(zee, -orient));
    }

    function renderVR() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const halfWidth = Math.floor(width / 2);

      if (!isVR) {
        renderer.setViewport(0, 0, width, height);
        renderer.setScissor(0, 0, width, height);
        renderer.setScissorTest(true);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.render(scene, camera);
        return;
      }

      // Renderização Estéreo Split-Screen com Deslocamento de Convergência (IPD Shift)
      camera.aspect = halfWidth / height;
      camera.updateProjectionMatrix();

      // Olho Esquerdo
      renderer.setViewport(0 + eyeShiftPixels, 0, halfWidth, height);
      renderer.setScissor(0, 0, halfWidth, height);
      renderer.setScissorTest(true);
      renderer.render(scene, camera);

      // Olho Direito
      renderer.setViewport(halfWidth - eyeShiftPixels, 0, halfWidth, height);
      renderer.setScissor(halfWidth, 0, halfWidth, height);
      renderer.setScissorTest(true);
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      renderer.setSize(window.innerWidth, window.innerHeight);
      applyCalibratedStyle();
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
