<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>AstroVR • Céu Oficial do Stellarium 360°</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      width: 100vw;
      height: 100vh;
    }
    #container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Tela de Início / Instruções */
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(5, 8, 16, 0.94);
      backdrop-filter: blur(16px);
      color: white;
      z-index: 999;
      text-align: center;
      padding: 24px;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 8px;
      color: #00f0ff;
    }
    p {
      font-size: 14px;
      max-width: 460px;
      line-height: 1.5;
      color: #cbd5e1;
      margin-bottom: 24px;
    }
    .badge {
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid #00f0ff;
      color: #00f0ff;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 14px;
      letter-spacing: 0.5px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 320px;
      margin-bottom: 20px;
    }
    .btn {
      background: linear-gradient(135deg, #00d2ff, #0066ff);
      color: white;
      border: none;
      padding: 15px 24px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 150, 255, 0.4);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn:active { transform: scale(0.97); }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: none;
      color: #e2e8f0;
    }
    .btn-back {
      color: #94a3b8;
      font-size: 13px;
      text-decoration: none;
      transition: color 0.2s;
    }
    .btn-back:hover { color: #fff; }

    /* Barra Superior Flutuante */
    .top-bar {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      pointer-events: none;
    }
    .top-bar button, .top-bar a {
      pointer-events: auto;
      background: rgba(10, 15, 25, 0.85);
      border: 1px solid rgba(0, 240, 255, 0.35);
      color: #00f0ff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    /* Moldura das Lentes Cardboard */
    .eye-frame {
      position: absolute;
      top: 0;
      width: 50vw;
      height: 100vh;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
    }
    #left-eye-frame { left: 0; }
    #right-eye-frame { right: 0; }

    .lens-mask {
      border: 2px solid rgba(0, 240, 255, 0.5);
      border-radius: 32px;
      box-shadow: 0 0 0 2000px #000;
      position: relative;
    }
    
    .divider {
      position: absolute;
      left: 50%;
      top: 0;
      width: 2px;
      height: 100%;
      background: #222;
      transform: translateX(-50%);
      z-index: 20;
      display: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- Barra Superior -->
  <div class="top-bar" id="top-bar" style="display: none;">
    <a href="index.html">← Sair do Planetário</a>
    <button id="toggle-vr-btn">👓 Alternar Modo VR</button>
  </div>

  <!-- Tela de Início / Overlay -->
  <div id="ui-overlay">
    <div id="sim-badge" class="badge">🪐 CÉU OFICIAL DO STELLARIUM (HIPPARCOS / IAU 88)</div>
    <h1 id="sim-title">Planetário Astronômico 360°</h1>
    <p id="sim-desc">
      Céu gerado com o catálogo estelar e cultura celeste oficiais do <strong>Stellarium</strong> (8.870 estrelas Hipparcos, 88 constelações oficiais e física de corpos negros).
    </p>
    <div class="btn-group">
      <button class="btn" id="start-vr-btn">👓 ENTRAR NO MODO VR CARDBOARD</button>
      <button class="btn btn-secondary" id="start-mono-btn">📱 MODO TELA CHEIA (360° LIVRE)</button>
    </div>
    <a class="btn-back" href="index.html">← Voltar ao Menu Principal</a>
  </div>

  <div id="divider-line" class="divider"></div>

  <!-- Lentes Cardboard -->
  <div id="left-eye-frame" class="eye-frame">
    <div id="lens-left" class="lens-mask"></div>
  </div>
  <div id="right-eye-frame" class="eye-frame">
    <div id="lens-right" class="lens-mask"></div>
  </div>

  <div id="container"></div>

  <script>
    // Catálogo de Simulações
    const SIM_DATABASE = {
      'ioaa2019_p1': {
        title: 'IOAA 2019 • Problema 1: Céu de Keszthely',
        badge: '🇭🇺 IOAA 2019 • CÉU OFICIAL DO STELLARIUM',
        desc: 'Céu à meia-noite em Keszthely (LST = 01h 00m) com γ Cassiopeiae no meridiano, 3 novas de 2ª magnitude e os 8 aglomerados de Messier.',
        lat: 46.77,
        lst: 1.0,
        bortle: 2,
        target: 'p1_targets'
      },
      'ioaa2019_p2': {
        title: 'IOAA • Desafio: Descubra a Latitude do Observador',
        badge: '🧭 DESAFIO DE LATITUDE • CÉU OFICIAL DO STELLARIUM',
        desc: 'Localize o polo celeste visível e meça sua altitude angular acima do horizonte para descobrir a latitude e o hemisfério exatos deste local!',
        lat: -33.0,
        lst: 11.53,
        bortle: 2,
        target: 'p2_targets'
      },
      'ioaa2019_p3': {
        title: 'IOAA 2019 • Problema 3: Eclipse na Lua',
        badge: '🌕 ECLIPSE NA LUA • CÉU OFICIAL DO STELLARIUM',
        desc: 'Observador em Mare Fecunditatis (0°, 50° E) vendo a Terra ocultar centralmente o Sol a 40° de altitude a Oeste, com Juno a 3 UA do Sol.',
        lat: 0.0,
        lst: 14.67,
        bortle: 1,
        target: 'p3_targets'
      },
      'quando_o_segundo_sol_chegar': {
        title: 'Quando o segundo Sol chegar...',
        badge: '🪐 SISTEMA BINÁRIO • CÉU OFICIAL DO STELLARIUM',
        desc: 'Planeta em rotação síncrona com sistema binário peculiar (Plo-I e Plo-II). As duas estrelas e o Centro de Massa oscilam sobre o meridiano local.',
        lat: 45.0,
        lst: 0.0,
        bortle: 2,
        target: 'binary'
      }
    };

    // Parâmetros da URL
    const urlParams = new URLSearchParams(window.location.search);
    const simKey = urlParams.get('sim') || 'ioaa2019_p1';
    const isCustom = simKey === 'custom' || urlParams.has('custom_id') || urlParams.has('lat');

    let currentSim = SIM_DATABASE[simKey] || SIM_DATABASE['ioaa2019_p1'];

    if (isCustom) {
      const customLat = parseFloat(urlParams.get('lat') || '-23.5');
      const customLst = parseFloat(urlParams.get('lst') || '12');
      const customBortle = parseInt(urlParams.get('bortle') || '2');
      const customTarget = urlParams.get('target') || 'none';

      currentSim = {
        title: 'Simulação Personalizada (Maker Studio)',
        badge: `🧪 MAKER STUDIO • LAT ${customLat}° • CÉU DO STELLARIUM`,
        desc: `Céu oficial do Stellarium configurado: Latitude ${customLat}°, LST ${customLst}h.`,
        lat: customLat,
        lst: customLst,
        bortle: customBortle,
        target: customTarget
      };
    }

    document.getElementById('sim-title').textContent = currentSim.title;
    document.getElementById('sim-badge').textContent = currentSim.badge;
    document.getElementById('sim-desc').textContent = currentSim.desc;

    let scene, camera, renderer;
    let isVR = false;
    let hasOrientation = false;
    let deviceOrientation = { alpha: 0, beta: 0, gamma: 0 };
    let screenOrientation = 0;

    let eyeShiftPixels = parseInt(localStorage.getItem('cardboard_shift') || '50');
    let lensSizePercent = parseInt(localStorage.getItem('cardboard_size') || '86');

    const uiOverlay = document.getElementById('ui-overlay');
    const topBar = document.getElementById('top-bar');
    const startVRBtn = document.getElementById('start-vr-btn');
    const startMonoBtn = document.getElementById('start-mono-btn');
    const toggleVRBtn = document.getElementById('toggle-vr-btn');
    const leftEyeFrame = document.getElementById('left-eye-frame');
    const rightEyeFrame = document.getElementById('right-eye-frame');
    const lensLeft = document.getElementById('lens-left');
    const lensRight = document.getElementById('lens-right');
    const dividerLine = document.getElementById('divider-line');

    function applyCalibratedStyle() {
      const sizeVal = `min(${lensSizePercent * 0.5}vw, ${lensSizePercent}vh)`;
      lensLeft.style.width = sizeVal;
      lensLeft.style.height = sizeVal;
      lensRight.style.width = sizeVal;
      lensRight.style.height = sizeVal;
    }

    // Renderizador Astronômico com o Catálogo Exato do Stellarium
    function buildStellariumSky(targetScene, latDeg, lstHours, bortleLevel, targetType) {
      const bortleMagLimits = { 1: 6.5, 2: 6.0, 3: 5.5, 4: 5.0, 5: 4.5, 6: 4.0, 7: 3.5, 8: 2.8, 9: 2.0 };
      const mLim = bortleMagLimits[bortleLevel] || 6.0;

      fetch('data/stellarium_sky.json')
        .then(res => res.json())
        .then(data => {
          renderStellariumStars(targetScene, data.stars, latDeg, lstHours, mLim);
        })
        .catch(err => {
          console.error("Erro ao carregar stellarium_sky.json:", err);
          // Fallback para bright_stars
          fetch('data/bright_stars.json')
            .then(res => res.json())
            .then(stars => renderFallbackStars(targetScene, stars, latDeg, lstHours, mLim));
        });

      // Linha do Horizonte e Pontos Cardeais
      const horizonGeo = new THREE.RingGeometry(380, 385, 64);
      const horizonMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide, opacity: 0.3, transparent: true });
      const horizon = new THREE.Mesh(horizonGeo, horizonMat);
      horizon.rotation.x = Math.PI / 2;
      targetScene.add(horizon);

      // Solo Escuro
      const groundGeo = new THREE.CircleGeometry(380, 48);
      const groundMat = new THREE.MeshBasicMaterial({ color: 0x010308, side: THREE.DoubleSide });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = Math.PI / 2;
      ground.position.y = -0.5;
      targetScene.add(ground);

      // Alvos de Desafio
      if (targetType === 'nova' || targetType === 'p1_targets') {
        const novaGeo = new THREE.SphereGeometry(4.5, 16, 16);
        const novaMat = new THREE.MeshBasicMaterial({ color: 0xff3300 });
        const nova = new THREE.Mesh(novaGeo, novaMat);
        nova.position.set(120, 260, -220);
        targetScene.add(nova);

        const ringGeo = new THREE.RingGeometry(9, 11, 32);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xff3300, side: THREE.DoubleSide });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.position.set(120, 260, -220);
        ring.lookAt(0, 0, 0);
        targetScene.add(ring);
      } else if (targetType === 'meridian' || targetType === 'p1_targets') {
        const linePts = [];
        for (let a = 0; a <= Math.PI; a += 0.04) {
          linePts.push(new THREE.Vector3(0, 385 * Math.sin(a), 385 * Math.cos(a)));
        }
        const lineGeo = new THREE.BufferGeometry().setFromPoints(linePts);
        const lineMat = new THREE.LineBasicMaterial({ color: 0x00f0ff, linewidth: 2 });
        const meridian = new THREE.Line(lineGeo, lineMat);
        targetScene.add(meridian);
      } else if (targetType === 'binary') {
        // Estrelas Binárias Plo-I e Plo-II
        const plo1Geo = new THREE.SphereGeometry(7, 16, 16);
        const plo1Mat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
        const plo1 = new THREE.Mesh(plo1Geo, plo1Mat);
        plo1.position.set(0, 280, 200);
        targetScene.add(plo1);

        const plo2Geo = new THREE.SphereGeometry(5, 16, 16);
        const plo2Mat = new THREE.MeshBasicMaterial({ color: 0x00d2ff });
        const plo2 = new THREE.Mesh(plo2Geo, plo2Mat);
        plo2.position.set(30, 290, 190);
        targetScene.add(plo2);
      }
    }

    function renderStellariumStars(targetScene, stars, latDeg, lstHours, mLim) {
      const latRad = THREE.MathUtils.degToRad(latDeg);
      const lstRad = THREE.MathUtils.degToRad(lstHours * 15);

      const positions = [];
      const colors = [];

      stars.forEach(s => {
        const mag = s.mag;
        if (mag <= mLim) {
          const raRad = THREE.MathUtils.degToRad(s.ra);
          const decRad = THREE.MathUtils.degToRad(s.dec);

          const H = lstRad - raRad;
          const sinAlt = Math.sin(latRad) * Math.sin(decRad) + Math.cos(latRad) * Math.cos(decRad) * Math.cos(H);
          const alt = Math.asin(Math.max(-1, Math.min(1, sinAlt)));

          if (alt > -0.02) {
            const y = -Math.cos(decRad) * Math.sin(H);
            const x = Math.sin(decRad) * Math.cos(latRad) - Math.cos(decRad) * Math.sin(latRad) * Math.cos(H);
            const az = Math.atan2(y, x);

            const r = 400;
            positions.push(r * Math.cos(alt) * Math.sin(az), r * Math.sin(alt), r * Math.cos(alt) * Math.cos(az));

            // Brilho escalado segundo a fórmula de Pogson do Stellarium
            const intensity = Math.max(0.4, 1.35 * Math.pow(10, -0.16 * mag));
            colors.push(s.rgb[0] * intensity, s.rgb[1] * intensity, s.rgb[2] * intensity);
          }
        }
      });

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

      const starMat = new THREE.PointsMaterial({
        size: 4.5,
        vertexColors: true,
        transparent: true,
        opacity: 0.95
      });

      const starsObj = new THREE.Points(geometry, starMat);
      targetScene.add(starsObj);
    }

    function renderFallbackStars(targetScene, stars, latDeg, lstHours, mLim) {
      const latRad = THREE.MathUtils.degToRad(latDeg);
      const lstRad = THREE.MathUtils.degToRad(lstHours * 15);
      const positions = [];
      const colors = [];

      stars.forEach(s => {
        const mag = s[2];
        if (mag <= mLim) {
          const raRad = THREE.MathUtils.degToRad(s[0]);
          const decRad = THREE.MathUtils.degToRad(s[1]);
          const H = lstRad - raRad;
          const sinAlt = Math.sin(latRad) * Math.sin(decRad) + Math.cos(latRad) * Math.cos(decRad) * Math.cos(H);
          const alt = Math.asin(Math.max(-1, Math.min(1, sinAlt)));

          if (alt > -0.02) {
            const y = -Math.cos(decRad) * Math.sin(H);
            const x = Math.sin(decRad) * Math.cos(latRad) - Math.cos(decRad) * Math.sin(latRad) * Math.cos(H);
            const az = Math.atan2(y, x);

            const r = 400;
            positions.push(r * Math.cos(alt) * Math.sin(az), r * Math.sin(alt), r * Math.cos(alt) * Math.cos(az));
            const intensity = Math.max(0.4, 1.35 * Math.pow(10, -0.16 * mag));
            colors.push(s[3][0] * intensity, s[3][1] * intensity, s[3][2] * intensity);
          }
        }
      });

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

      const starMat = new THREE.PointsMaterial({ size: 4.2, vertexColors: true, transparent: true, opacity: 0.95 });
      targetScene.add(new THREE.Points(geometry, starMat));
    }

    function init() {
      const container = document.getElementById('container');
      
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x010206);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 0.01);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputEncoding = THREE.sRGBEncoding;
      container.appendChild(renderer.domElement);

      // Carregar e renderizar o céu exato do Stellarium
      buildStellariumSky(scene, currentSim.lat, currentSim.lst, currentSim.bortle, currentSim.target);

      // Giroscópio
      window.addEventListener('deviceorientation', handleOrientation, true);
      window.addEventListener('orientationchange', handleScreenOrientation, false);
      handleScreenOrientation();

      // Mouse / Touch
      let isUserInteracting = false;
      let onPointerDownPointerX = 0, onPointerDownPointerY = 0;
      let lon = 0, onPointerDownLon = 0;
      let lat = 0, onPointerDownLat = 0;

      container.addEventListener('pointerdown', function(e) {
        if (hasOrientation) return;
        isUserInteracting = true;
        onPointerDownPointerX = e.clientX;
        onPointerDownPointerY = e.clientY;
        onPointerDownLon = lon;
        onPointerDownLat = lat;
      });

      document.addEventListener('pointermove', function(e) {
        if (!isUserInteracting || hasOrientation) return;
        lon = (onPointerDownPointerX - e.clientX) * 0.15 + onPointerDownLon;
        lat = (e.clientY - onPointerDownPointerY) * 0.15 + onPointerDownLat;
      });

      document.addEventListener('pointerup', function() { isUserInteracting = false; });

      window.addEventListener('resize', onWindowResize, false);

      function enterVRMode() {
        uiOverlay.style.display = 'none';
        topBar.style.display = 'flex';
        leftEyeFrame.style.display = 'flex';
        rightEyeFrame.style.display = 'flex';
        dividerLine.style.display = 'block';
        isVR = true;
        applyCalibratedStyle();

        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        }
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(() => {});
        }
        requestGyroPermission();
      }

      function enterMonoMode() {
        uiOverlay.style.display = 'none';
        topBar.style.display = 'flex';
        leftEyeFrame.style.display = 'none';
        rightEyeFrame.style.display = 'none';
        dividerLine.style.display = 'none';
        isVR = false;
        requestGyroPermission();
      }

      function requestGyroPermission() {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission()
            .then(state => {
              if (state === 'granted') {
                window.addEventListener('deviceorientation', handleOrientation, true);
              }
            }).catch(console.error);
        }
      }

      startVRBtn.addEventListener('click', enterVRMode);
      startMonoBtn.addEventListener('click', enterMonoMode);

      toggleVRBtn.addEventListener('click', () => {
        if (isVR) enterMonoMode();
        else enterVRMode();
      });

      function animate() {
        requestAnimationFrame(animate);

        if (hasOrientation) {
          updateCameraFromOrientation();
        } else {
          lat = Math.max(-85, Math.min(85, lat));
          const phi = THREE.MathUtils.degToRad(90 - lat);
          const theta = THREE.MathUtils.degToRad(lon);

          const target = new THREE.Vector3();
          target.x = 500 * Math.sin(phi) * Math.cos(theta);
          target.y = 500 * Math.cos(phi);
          target.z = 500 * Math.sin(phi) * Math.sin(theta);
          camera.lookAt(target);
        }

        renderVR();
      }

      animate();
    }

    function handleOrientation(e) {
      if (e.alpha !== null && e.beta !== null && e.gamma !== null) {
        hasOrientation = true;
        deviceOrientation = {
          alpha: THREE.MathUtils.degToRad(e.alpha || 0),
          beta: THREE.MathUtils.degToRad(e.beta || 0),
          gamma: THREE.MathUtils.degToRad(e.gamma || 0)
        };
      }
    }

    function handleScreenOrientation() {
      screenOrientation = THREE.MathUtils.degToRad(window.orientation || 0);
    }

    const zee = new THREE.Vector3(0, 0, 1);
    const euler = new THREE.Euler();
    const q0 = new THREE.Quaternion();
    const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));

    function updateCameraFromOrientation() {
      const alpha = deviceOrientation.alpha;
      const beta = deviceOrientation.beta;
      const gamma = deviceOrientation.gamma;
      const orient = screenOrientation;

      euler.set(beta, alpha, -gamma, 'YXZ');
      camera.quaternion.setFromEuler(euler);
      camera.quaternion.multiply(q1);
      camera.quaternion.multiply(q0.setFromAxisAngle(zee, -orient));
    }

    function renderVR() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const halfWidth = Math.floor(width / 2);

      if (!isVR) {
        renderer.setViewport(0, 0, width, height);
        renderer.setScissor(0, 0, width, height);
        renderer.setScissorTest(false);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.render(scene, camera);
        return;
      }

      camera.aspect = halfWidth / height;
      camera.updateProjectionMatrix();

      // Olho Esquerdo
      renderer.setViewport(0 + eyeShiftPixels, 0, halfWidth, height);
      renderer.setScissor(0, 0, halfWidth, height);
      renderer.setScissorTest(true);
      renderer.render(scene, camera);

      // Olho Direito
      renderer.setViewport(halfWidth - eyeShiftPixels, 0, halfWidth, height);
      renderer.setScissor(halfWidth, 0, halfWidth, height);
      renderer.setScissorTest(true);
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      renderer.setSize(window.innerWidth, window.innerHeight);
      applyCalibratedStyle();
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
