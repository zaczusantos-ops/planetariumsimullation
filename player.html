<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>AstroVR • Planetário Stellarium 360°</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      overflow: hidden;
      background-color: #010206;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      width: 100vw;
      height: 100vh;
    }
    #container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Tela Inicial / Overlay */
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(4, 7, 14, 0.94);
      backdrop-filter: blur(16px);
      color: white;
      z-index: 999;
      text-align: center;
      padding: 24px;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 8px;
      color: #00f0ff;
    }
    p {
      font-size: 14px;
      max-width: 480px;
      line-height: 1.5;
      color: #cbd5e1;
      margin-bottom: 24px;
    }
    .badge {
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid #00f0ff;
      color: #00f0ff;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 14px;
      letter-spacing: 0.5px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 320px;
      margin-bottom: 20px;
    }
    .btn {
      background: linear-gradient(135deg, #00d2ff, #0066ff);
      color: white;
      border: none;
      padding: 15px 24px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 150, 255, 0.4);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn:active { transform: scale(0.97); }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: none;
      color: #e2e8f0;
    }
    .btn-back {
      color: #94a3b8;
      font-size: 13px;
      text-decoration: none;
      transition: color 0.2s;
    }
    .btn-back:hover { color: #fff; }

    /* Barra Superior */
    .top-bar {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      pointer-events: none;
    }
    .top-bar button, .top-bar a {
      pointer-events: auto;
      background: rgba(10, 15, 25, 0.85);
      border: 1px solid rgba(0, 240, 255, 0.35);
      color: #00f0ff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    /* Moldura das Lentes Cardboard */
    .eye-frame {
      position: absolute;
      top: 0;
      width: 50vw;
      height: 100vh;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
    }
    #left-eye-frame { left: 0; }
    #right-eye-frame { right: 0; }

    .lens-mask {
      border: 2px solid rgba(0, 240, 255, 0.5);
      border-radius: 32px;
      box-shadow: 0 0 0 2000px #000;
      position: relative;
    }
    
    .divider {
      position: absolute;
      left: 50%;
      top: 0;
      width: 2px;
      height: 100%;
      background: #222;
      transform: translateX(-50%);
      z-index: 20;
      display: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- Barra Superior -->
  <div class="top-bar" id="top-bar" style="display: none;">
    <a href="index.html">← Sair do Planetário</a>
    <button id="toggle-vr-btn">👓 Alternar Modo VR</button>
  </div>

  <!-- Tela de Início / Overlay -->
  <div id="ui-overlay">
    <div id="sim-badge" class="badge">🪐 CÉU DO STELLARIUM (HIPPARCOS REAL)</div>
    <h1 id="sim-title">Planetário Astronômico 360°</h1>
    <p id="sim-desc">
      Explore o céu em 360°. Para usar com óculos VR Cardboard, clique no botão azul e vire o smartphone na horizontal.
    </p>
    <div class="btn-group">
      <button class="btn" id="start-vr-btn">👓 ENTRAR NO MODO VR CARDBOARD</button>
      <button class="btn btn-secondary" id="start-mono-btn">📱 MODO TELA CHEIA (360° LIVRE)</button>
    </div>
    <a class="btn-back" href="index.html">← Voltar ao Catálogo de Simulações</a>
  </div>

  <div id="divider-line" class="divider"></div>

  <!-- Lentes Cardboard -->
  <div id="left-eye-frame" class="eye-frame">
    <div id="lens-left" class="lens-mask"></div>
  </div>
  <div id="right-eye-frame" class="eye-frame">
    <div id="lens-right" class="lens-mask"></div>
  </div>

  <div id="container"></div>

  <script>
    // 1. Definições Oficiais de Cada Simulação (Distintas e Físicas)
    const SIM_DATABASE = {
      'ioaa2019_p1': {
        title: 'IOAA 2019 • Problema 1: Céu de Keszthely',
        badge: '🇭🇺 IOAA 2019 • HUNGARY ROUND 1',
        desc: 'Céu à meia-noite em Keszthely (+46.8° N, LST = 01h 00m) com γ Cassiopeiae no meridiano, 3 novas de 2ª magnitude e os 8 aglomerados de Messier.',
        lat: 46.77,
        lst: 1.0,
        bortle: 2,
        sceneType: 'p1_keszthely'
      },
      'ioaa2019_p2': {
        title: 'IOAA • Desafio: Descubra a Latitude do Observador',
        badge: '🧭 DESAFIO DE LATITUDE (CÉU REAL)',
        desc: 'Localize o polo celeste visível e meça sua altitude angular acima do horizonte para descobrir a latitude e o hemisfério exatos deste local!',
        lat: -33.0,
        lst: 11.53,
        bortle: 2,
        sceneType: 'p2_latitude'
      },
      'ioaa2019_p3': {
        title: 'IOAA 2019 • Problema 3: Eclipse na Lua',
        badge: '🌕 OBSERVADOR NA LUA • ECLIPSE POR TERRA',
        desc: 'Observador em Mare Fecunditatis (0°, 50° E) vendo a Terra ocultar centralmente o Sol a 40° de altitude a Oeste com o anel atmosférico avermelhado.',
        lat: 0.0,
        lst: 14.67,
        bortle: 1,
        sceneType: 'p3_lunar'
      },
      'quando_o_segundo_sol_chegar': {
        title: 'Quando o segundo Sol chegar...',
        badge: '🪐 SISTEMA BINÁRIO SINCRONIZADO',
        desc: 'Planeta em rotação síncrona com sistema binário peculiar (Plo-I e Plo-II). As duas estrelas e o Centro de Massa oscilam sobre o meridiano local.',
        lat: 45.0,
        lst: 0.0,
        bortle: 2,
        sceneType: 'binary_system'
      }
    };

    // Leitura dos Parâmetros da URL
    const urlParams = new URLSearchParams(window.location.search);
    const simKey = urlParams.get('sim') || 'ioaa2019_p1';
    const isCustom = simKey === 'custom' || urlParams.has('custom_id') || urlParams.has('lat');

    let currentSim = SIM_DATABASE[simKey] || SIM_DATABASE['ioaa2019_p1'];

    if (isCustom) {
      const customLat = parseFloat(urlParams.get('lat') || '-23.5');
      const customLst = parseFloat(urlParams.get('lst') || '12');
      const customBortle = parseInt(urlParams.get('bortle') || '2');
      const customTarget = urlParams.get('target') || 'none';

      currentSim = {
        title: 'Simulação Personalizada (Maker Studio)',
        badge: `🧪 MAKER STUDIO • LAT ${customLat}° • CÉU STELLARIUM`,
        desc: `Céu customizado: Latitude ${customLat}°, LST ${customLst}h.`,
        lat: customLat,
        lst: customLst,
        bortle: customBortle,
        sceneType: 'custom_maker',
        customTarget: customTarget
      };
    }

    document.getElementById('sim-title').textContent = currentSim.title;
    document.getElementById('sim-badge').textContent = currentSim.badge;
    document.getElementById('sim-desc').textContent = currentSim.desc;

    let scene, camera, renderer;
    let isVR = false;
    let hasOrientation = false;
    let deviceOrientation = { alpha: 0, beta: 0, gamma: 0 };
    let screenOrientation = 0;

    let eyeShiftPixels = parseInt(localStorage.getItem('cardboard_shift') || '50');
    let lensSizePercent = parseInt(localStorage.getItem('cardboard_size') || '86');

    const uiOverlay = document.getElementById('ui-overlay');
    const topBar = document.getElementById('top-bar');
    const startVRBtn = document.getElementById('start-vr-btn');
    const startMonoBtn = document.getElementById('start-mono-btn');
    const toggleVRBtn = document.getElementById('toggle-vr-btn');
    const leftEyeFrame = document.getElementById('left-eye-frame');
    const rightEyeFrame = document.getElementById('right-eye-frame');
    const lensLeft = document.getElementById('lens-left');
    const lensRight = document.getElementById('lens-right');
    const dividerLine = document.getElementById('divider-line');

    function applyCalibratedStyle() {
      const sizeVal = `min(${lensSizePercent * 0.5}vw, ${lensSizePercent}vh)`;
      lensLeft.style.width = sizeVal;
      lensLeft.style.height = sizeVal;
      lensRight.style.width = sizeVal;
      lensRight.style.height = sizeVal;
    }

    // 2. Criação da Textura de Ponto Suave Circular (Airy Disk / Glow do Stellarium)
    function createGlowStarTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
      grad.addColorStop(0.18, 'rgba(255, 255, 255, 0.95)');
      grad.addColorStop(0.40, 'rgba(255, 255, 255, 0.45)');
      grad.addColorStop(0.75, 'rgba(255, 255, 255, 0.10)');
      grad.addColorStop(1.0, 'rgba(255, 255, 255, 0.0)');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 64, 64);

      const tex = new THREE.CanvasTexture(canvas);
      tex.needsUpdate = true;
      return tex;
    }

    // 3. Shaders GLSL de Estrelas do Stellarium (Pontos Redondos + Escala de Pogson)
    const starVertexShader = `
      attribute float aSize;
      attribute vec3 aColor;
      varying vec3 vColor;
      void main() {
        vColor = aColor;
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = aSize * (400.0 / -mvPosition.z);
        gl_Position = projectionMatrix * mvPosition;
      }
    `;

    const starFragmentShader = `
      uniform sampler2D pointTexture;
      varying vec3 vColor;
      void main() {
        vec4 texColor = texture2D(pointTexture, gl_PointCoord);
        if (texColor.a < 0.05) discard;
        gl_FragColor = vec4(vColor, texColor.a);
      }
    `;

    // 4. Montador Astronômico do Céu Oficial do Stellarium
    function buildAstronomicalScene(targetScene, simConfig) {
      const latDeg = simConfig.lat;
      const lstHours = simConfig.lst;
      const bortleLevel = simConfig.bortle || 2;
      const sceneType = simConfig.sceneType;

      const bortleMagLimits = { 1: 6.5, 2: 6.0, 3: 5.5, 4: 5.0, 5: 4.5, 6: 4.0, 7: 3.5, 8: 2.8, 9: 2.0 };
      const mLim = bortleMagLimits[bortleLevel] || 6.0;

      // Carregar catálogo de estrelas do Stellarium
      fetch('data/stellarium_sky.json')
        .then(res => res.json())
        .then(data => {
          renderStellariumStarField(targetScene, data.stars, latDeg, lstHours, mLim);
        })
        .catch(err => {
          console.error("Erro ao carregar stellarium_sky.json, tentando fallback:", err);
          fetch('data/bright_stars.json')
            .then(res => res.json())
            .then(stars => renderFallbackStarField(targetScene, stars, latDeg, lstHours, mLim));
        });

      // Elementos Específicos e Únicos de Cada Simulação
      if (sceneType === 'p1_keszthely') {
        buildSceneKeszthely(targetScene, latDeg);
      } else if (sceneType === 'p2_latitude') {
        buildSceneLatitudeChallenge(targetScene, latDeg);
      } else if (sceneType === 'p3_lunar') {
        buildSceneLunarEclipse(targetScene);
      } else if (sceneType === 'binary_system') {
        buildSceneBinarySystem(targetScene);
      } else if (sceneType === 'custom_maker') {
        buildSceneCustomMaker(targetScene, simConfig.customTarget);
      }

      // Linha do Horizonte e Solo (Apenas se não for na Lua)
      if (sceneType !== 'p3_lunar') {
        const horizonGeo = new THREE.RingGeometry(385, 390, 64);
        const horizonMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide, opacity: 0.35, transparent: true });
        const horizon = new THREE.Mesh(horizonGeo, horizonMat);
        horizon.rotation.x = Math.PI / 2;
        targetScene.add(horizon);

        const groundGeo = new THREE.CircleGeometry(385, 48);
        const groundMat = new THREE.MeshBasicMaterial({ color: 0x010306, side: THREE.DoubleSide });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = Math.PI / 2;
        ground.position.y = -0.5;
        targetScene.add(ground);
      }
    }

    function renderStellariumStarField(targetScene, stars, latDeg, lstHours, mLim) {
      const latRad = THREE.MathUtils.degToRad(latDeg);
      const lstRad = THREE.MathUtils.degToRad(lstHours * 15);

      const positions = [];
      const colors = [];
      const sizes = [];

      stars.forEach(s => {
        const mag = s.mag;
        if (mag <= mLim) {
          const raRad = THREE.MathUtils.degToRad(s.ra);
          const decRad = THREE.MathUtils.degToRad(s.dec);

          const H = lstRad - raRad;
          const sinAlt = Math.sin(latRad) * Math.sin(decRad) + Math.cos(latRad) * Math.cos(decRad) * Math.cos(H);
          const alt = Math.asin(Math.max(-1, Math.min(1, sinAlt)));

          if (alt > -0.01) {
            const y = -Math.cos(decRad) * Math.sin(H);
            const x = Math.sin(decRad) * Math.cos(latRad) - Math.cos(decRad) * Math.sin(latRad) * Math.cos(H);
            const az = Math.atan2(y, x);

            const r = 400;
            positions.push(r * Math.cos(alt) * Math.sin(az), r * Math.sin(alt), r * Math.cos(alt) * Math.cos(az));

            // Tamanho por escala de Pogson (Stellarium PSF)
            // Sirius (mag -1.44) -> 24px; Estrelas fracas (mag 6.0) -> 3px
            const starSize = Math.max(3.0, Math.min(26.0, 15.0 * Math.pow(10.0, -0.16 * mag)));
            sizes.push(starSize);

            // Brilho visual
            const intensity = Math.max(0.45, 1.4 * Math.pow(10.0, -0.16 * mag));
            colors.push(s.rgb[0] * intensity, s.rgb[1] * intensity, s.rgb[2] * intensity);
          }
        }
      });

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('aColor', new THREE.Float32BufferAttribute(colors, 3));
      geometry.setAttribute('aSize', new THREE.Float32BufferAttribute(sizes, 1));

      const starShaderMaterial = new THREE.ShaderMaterial({
        uniforms: {
          pointTexture: { value: createGlowStarTexture() }
        },
        vertexShader: starVertexShader,
        fragmentShader: starFragmentShader,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const starsMesh = new THREE.Points(geometry, starShaderMaterial);
      targetScene.add(starsMesh);
    }

    function renderFallbackStarField(targetScene, stars, latDeg, lstHours, mLim) {
      const latRad = THREE.MathUtils.degToRad(latDeg);
      const lstRad = THREE.MathUtils.degToRad(lstHours * 15);
      const positions = [], colors = [], sizes = [];

      stars.forEach(s => {
        const mag = s[2];
        if (mag <= mLim) {
          const raRad = THREE.MathUtils.degToRad(s[0]);
          const decRad = THREE.MathUtils.degToRad(s[1]);
          const H = lstRad - raRad;
          const sinAlt = Math.sin(latRad) * Math.sin(decRad) + Math.cos(latRad) * Math.cos(decRad) * Math.cos(H);
          const alt = Math.asin(Math.max(-1, Math.min(1, sinAlt)));

          if (alt > -0.01) {
            const y = -Math.cos(decRad) * Math.sin(H);
            const x = Math.sin(decRad) * Math.cos(latRad) - Math.cos(decRad) * Math.sin(latRad) * Math.cos(H);
            const az = Math.atan2(y, x);

            const r = 400;
            positions.push(r * Math.cos(alt) * Math.sin(az), r * Math.sin(alt), r * Math.cos(alt) * Math.cos(az));
            sizes.push(Math.max(3.0, Math.min(26.0, 15.0 * Math.pow(10.0, -0.16 * mag))));
            const intensity = Math.max(0.45, 1.4 * Math.pow(10.0, -0.16 * mag));
            colors.push(s[3][0] * intensity, s[3][1] * intensity, s[3][2] * intensity);
          }
        }
      });

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('aColor', new THREE.Float32BufferAttribute(colors, 3));
      geometry.setAttribute('aSize', new THREE.Float32BufferAttribute(sizes, 1));

      const starShaderMaterial = new THREE.ShaderMaterial({
        uniforms: { pointTexture: { value: createGlowStarTexture() } },
        vertexShader: starVertexShader,
        fragmentShader: starFragmentShader,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      targetScene.add(new THREE.Points(geometry, starShaderMaterial));
    }

    // --- CENÁRIOS ESPECÍFICOS ---

    // 1. IOAA Problema 1: Keszthely (Hungria)
    function buildSceneKeszthely(scene, latDeg) {
      // Arco do Meridiano Celeste Local (Norte -> Zênite -> Sul)
      const linePts = [];
      for (let a = 0; a <= Math.PI; a += 0.03) {
        linePts.push(new THREE.Vector3(0, 390 * Math.sin(a), 390 * Math.cos(a)));
      }
      const lineGeo = new THREE.BufferGeometry().setFromPoints(linePts);
      const lineMat = new THREE.LineBasicMaterial({ color: 0x00f0ff, linewidth: 2, transparent: true, opacity: 0.6 });
      scene.add(new THREE.Line(lineGeo, lineMat));

      // 3 Novas com anéis indicadores (Pegasus, Cygnus, Auriga)
      const novaPositions = [
        new THREE.Vector3(140, 270, -250), // Pegasus
        new THREE.Vector3(-80, 310, -210), // Cygnus
        new THREE.Vector3(260, 180, 200)   // Auriga
      ];
      novaPositions.forEach(pos => {
        const novaGeo = new THREE.SphereGeometry(3.5, 16, 16);
        const novaMat = new THREE.MeshBasicMaterial({ color: 0xff4422 });
        const novaMesh = new THREE.Mesh(novaGeo, novaMat);
        novaMesh.position.copy(pos);
        scene.add(novaMesh);

        const ringGeo = new THREE.RingGeometry(8, 10, 32);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xff3300, side: THREE.DoubleSide });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.position.copy(pos);
        ringMesh.lookAt(0, 0, 0);
        scene.add(ringMesh);
      });

      // 8 Aglomerados de Messier (M2, M13, M15, M30, M56, M71, M72, M92)
      const messierPositions = [
        new THREE.Vector3(80, 220, -280),
        new THREE.Vector3(-140, 290, -180),
        new THREE.Vector3(120, 240, -260),
        new THREE.Vector3(90, 80, -350),
        new THREE.Vector3(-50, 300, -210),
        new THREE.Vector3(-20, 280, -240),
        new THREE.Vector3(60, 140, -320),
        new THREE.Vector3(-110, 320, -150)
      ];
      messierPositions.forEach(pos => {
        const mGeo = new THREE.SphereGeometry(4.0, 12, 12);
        const mMat = new THREE.MeshBasicMaterial({ color: 0x88ccff, transparent: true, opacity: 0.5 });
        const mMesh = new THREE.Mesh(mGeo, mMat);
        mMesh.position.copy(pos);
        scene.add(mMesh);
      });
    }

    // 2. IOAA Problema 2: Desafio de Latitude (Lat -33.0° Sul)
    function buildSceneLatitudeChallenge(scene, latDeg) {
      // 3 Cometas com caudas de poeira e gás
      const cometData = [
        { pos: new THREE.Vector3(150, 210, 280), tailDir: new THREE.Vector3(0.3, 0.8, -0.5) },
        { pos: new THREE.Vector3(-220, 260, 140), tailDir: new THREE.Vector3(-0.4, 0.7, -0.4) }, // Na Eclíptica
        { pos: new THREE.Vector3(260, 120, -200), tailDir: new THREE.Vector3(0.5, 0.6, 0.5) }
      ];

      cometData.forEach((c, idx) => {
        const headGeo = new THREE.SphereGeometry(3.8, 16, 16);
        const headMat = new THREE.MeshBasicMaterial({ color: 0x88ffff });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.copy(c.pos);
        scene.add(head);

        // Cauda do cometa
        const tailPts = [c.pos.clone(), c.pos.clone().add(c.tailDir.clone().multiplyScalar(45))];
        const tailGeo = new THREE.BufferGeometry().setFromPoints(tailPts);
        const tailMat = new THREE.LineBasicMaterial({ color: 0x44ccff, linewidth: 3, transparent: true, opacity: 0.7 });
        scene.add(new THREE.Line(tailGeo, tailMat));
      });
    }

    // 3. IOAA Problema 3: Observador na Lua (Eclipse Solar por Terra)
    function buildSceneLunarEclipse(scene) {
      // Superfície / Relevo Lunar em 360°
      const moonTerrainGeo = new THREE.RingGeometry(20, 390, 64);
      const moonTerrainMat = new THREE.MeshBasicMaterial({ color: 0x22252c, side: THREE.DoubleSide });
      const moonTerrain = new THREE.Mesh(moonTerrainGeo, moonTerrainMat);
      moonTerrain.rotation.x = Math.PI / 2;
      moonTerrain.position.y = -1.2;
      scene.add(moonTerrain);

      // Terra eclipsando o Sol a 40° de altitude a Oeste (Az ~270°)
      const earthAltRad = THREE.MathUtils.degToRad(40);
      const earthAzRad = THREE.MathUtils.degToRad(270);
      const earthR = 380;
      const earthPos = new THREE.Vector3(
        earthR * Math.cos(earthAltRad) * Math.sin(earthAzRad),
        earthR * Math.sin(earthAltRad),
        earthR * Math.cos(earthAltRad) * Math.cos(earthAzRad)
      );

      // Disco Escuro da Terra
      const earthGeo = new THREE.SphereGeometry(18, 32, 32);
      const earthMat = new THREE.MeshBasicMaterial({ color: 0x050810 });
      const earthMesh = new THREE.Mesh(earthGeo, earthMat);
      earthMesh.position.copy(earthPos);
      scene.add(earthMesh);

      // Anel Atmosférico Vermelho Laranja da Terra (Refração de Rayleigh do pôr/nascer do Sol terrestre)
      const ringGeo = new THREE.RingGeometry(18.2, 22.5, 64);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0xff3300, side: THREE.DoubleSide, transparent: true, opacity: 0.95 });
      const ringMesh = new THREE.Mesh(ringGeo, ringMat);
      ringMesh.position.copy(earthPos);
      ringMesh.lookAt(0, 0, 0);
      scene.add(ringMesh);

      // Asteróide Juno (em Virgem)
      const junoGeo = new THREE.SphereGeometry(2.5, 12, 12);
      const junoMat = new THREE.MeshBasicMaterial({ color: 0xeeeeaa });
      const junoMesh = new THREE.Mesh(junoGeo, junoMat);
      junoMesh.position.set(earthPos.x + 35, earthPos.y - 15, earthPos.z + 20);
      scene.add(junoMesh);
    }

    // 4. Sistema Binário Sincronizado
    function buildSceneBinarySystem(scene) {
      // Meridiano
      const linePts = [];
      for (let a = 0; a <= Math.PI; a += 0.03) {
        linePts.push(new THREE.Vector3(0, 390 * Math.sin(a), 390 * Math.cos(a)));
      }
      const lineGeo = new THREE.BufferGeometry().setFromPoints(linePts);
      const lineMat = new THREE.LineBasicMaterial({ color: 0x00f0ff, linewidth: 2, transparent: true, opacity: 0.5 });
      scene.add(new THREE.Line(lineGeo, lineMat));

      // Sol Plo-I (Estrela Dourada Tipo G)
      const plo1Geo = new THREE.SphereGeometry(10, 24, 24);
      const plo1Mat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
      const plo1 = new THREE.Mesh(plo1Geo, plo1Mat);
      plo1.position.set(0, 270, 220);
      scene.add(plo1);

      // Sol Plo-II (Estrela Azul-Ciano Tipo B)
      const plo2Geo = new THREE.SphereGeometry(7, 24, 24);
      const plo2Mat = new THREE.MeshBasicMaterial({ color: 0x00d2ff });
      const plo2 = new THREE.Mesh(plo2Geo, plo2Mat);
      plo2.position.set(38, 290, 205);
      scene.add(plo2);

      // Centro de Massa (Ponto Cruzado no Meridiano)
      const comGeo = new THREE.SphereGeometry(2.5, 12, 12);
      const comMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const com = new THREE.Mesh(comGeo, comMat);
      com.position.set(0, 278, 214);
      scene.add(com);
    }

    // 5. Maker Studio Customizado
    function buildSceneCustomMaker(scene, customTarget) {
      if (customTarget === 'nova') {
        const novaGeo = new THREE.SphereGeometry(4.5, 16, 16);
        const novaMat = new THREE.MeshBasicMaterial({ color: 0xff3300 });
        const nova = new THREE.Mesh(novaGeo, novaMat);
        nova.position.set(120, 260, -220);
        scene.add(nova);

        const ringGeo = new THREE.RingGeometry(9, 11, 32);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xff3300, side: THREE.DoubleSide });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.position.set(120, 260, -220);
        ring.lookAt(0, 0, 0);
        scene.add(ring);
      } else if (customTarget === 'meridian') {
        const linePts = [];
        for (let a = 0; a <= Math.PI; a += 0.04) {
          linePts.push(new THREE.Vector3(0, 385 * Math.sin(a), 385 * Math.cos(a)));
        }
        const lineGeo = new THREE.BufferGeometry().setFromPoints(linePts);
        const lineMat = new THREE.LineBasicMaterial({ color: 0x00f0ff, linewidth: 2 });
        scene.add(new THREE.Line(lineGeo, lineMat));
      } else if (customTarget === 'comet') {
        const headGeo = new THREE.SphereGeometry(4, 16, 16);
        const head = new THREE.Mesh(headGeo, new THREE.MeshBasicMaterial({ color: 0x88ffff }));
        head.position.set(160, 230, 200);
        scene.add(head);

        const tailPts = [new THREE.Vector3(160, 230, 200), new THREE.Vector3(190, 280, 160)];
        scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(tailPts), new THREE.LineBasicMaterial({ color: 0x44ccff, linewidth: 3 })));
      } else if (customTarget === 'eclipse') {
        buildSceneLunarEclipse(scene);
      }
    }

    // 5. Inicialização da Cena WebGL / VR
    function init() {
      const container = document.getElementById('container');
      
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x010206);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 0.01);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputEncoding = THREE.sRGBEncoding;
      container.appendChild(renderer.domElement);

      // Montar a cena física correspondente à simulação selecionada
      buildAstronomicalScene(scene, currentSim);

      // Suporte a Giroscópio
      window.addEventListener('deviceorientation', handleOrientation, true);
      window.addEventListener('orientationchange', handleScreenOrientation, false);
      handleScreenOrientation();

      // Suporte a Mouse / Touch para Desktop e Celular
      let isUserInteracting = false;
      let onPointerDownPointerX = 0, onPointerDownPointerY = 0;
      let lon = 0, onPointerDownLon = 0;
      let lat = 0, onPointerDownLat = 0;

      container.addEventListener('pointerdown', function(e) {
        if (hasOrientation) return;
        isUserInteracting = true;
        onPointerDownPointerX = e.clientX;
        onPointerDownPointerY = e.clientY;
        onPointerDownLon = lon;
        onPointerDownLat = lat;
      });

      document.addEventListener('pointermove', function(e) {
        if (!isUserInteracting || hasOrientation) return;
        lon = (onPointerDownPointerX - e.clientX) * 0.15 + onPointerDownLon;
        lat = (e.clientY - onPointerDownPointerY) * 0.15 + onPointerDownLat;
      });

      document.addEventListener('pointerup', function() { isUserInteracting = false; });

      window.addEventListener('resize', onWindowResize, false);

      function enterVRMode() {
        uiOverlay.style.display = 'none';
        topBar.style.display = 'flex';
        leftEyeFrame.style.display = 'flex';
        rightEyeFrame.style.display = 'flex';
        dividerLine.style.display = 'block';
        isVR = true;
        applyCalibratedStyle();

        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        }
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(() => {});
        }
        requestGyroPermission();
      }

      function enterMonoMode() {
        uiOverlay.style.display = 'none';
        topBar.style.display = 'flex';
        leftEyeFrame.style.display = 'none';
        rightEyeFrame.style.display = 'none';
        dividerLine.style.display = 'none';
        isVR = false;
        requestGyroPermission();
      }

      function requestGyroPermission() {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission()
            .then(state => {
              if (state === 'granted') {
                window.addEventListener('deviceorientation', handleOrientation, true);
              }
            }).catch(console.error);
        }
      }

      startVRBtn.addEventListener('click', enterVRMode);
      startMonoBtn.addEventListener('click', enterMonoMode);

      toggleVRBtn.addEventListener('click', () => {
        if (isVR) enterMonoMode();
        else enterVRMode();
      });

      function animate() {
        requestAnimationFrame(animate);

        if (hasOrientation) {
          updateCameraFromOrientation();
        } else {
          lat = Math.max(-85, Math.min(85, lat));
          const phi = THREE.MathUtils.degToRad(90 - lat);
          const theta = THREE.MathUtils.degToRad(lon);

          const target = new THREE.Vector3();
          target.x = 500 * Math.sin(phi) * Math.cos(theta);
          target.y = 500 * Math.cos(phi);
          target.z = 500 * Math.sin(phi) * Math.sin(theta);
          camera.lookAt(target);
        }

        renderVR();
      }

      animate();
    }

    function handleOrientation(e) {
      if (e.alpha !== null && e.beta !== null && e.gamma !== null) {
        hasOrientation = true;
        deviceOrientation = {
          alpha: THREE.MathUtils.degToRad(e.alpha || 0),
          beta: THREE.MathUtils.degToRad(e.beta || 0),
          gamma: THREE.MathUtils.degToRad(e.gamma || 0)
        };
      }
    }

    function handleScreenOrientation() {
      screenOrientation = THREE.MathUtils.degToRad(window.orientation || 0);
    }

    const zee = new THREE.Vector3(0, 0, 1);
    const euler = new THREE.Euler();
    const q0 = new THREE.Quaternion();
    const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));

    function updateCameraFromOrientation() {
      const alpha = deviceOrientation.alpha;
      const beta = deviceOrientation.beta;
      const gamma = deviceOrientation.gamma;
      const orient = screenOrientation;

      euler.set(beta, alpha, -gamma, 'YXZ');
      camera.quaternion.setFromEuler(euler);
      camera.quaternion.multiply(q1);
      camera.quaternion.multiply(q0.setFromAxisAngle(zee, -orient));
    }

    function renderVR() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const halfWidth = Math.floor(width / 2);

      if (!isVR) {
        renderer.setViewport(0, 0, width, height);
        renderer.setScissor(0, 0, width, height);
        renderer.setScissorTest(false);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.render(scene, camera);
        return;
      }

      camera.aspect = halfWidth / height;
      camera.updateProjectionMatrix();

      // Olho Esquerdo
      renderer.setViewport(0 + eyeShiftPixels, 0, halfWidth, height);
      renderer.setScissor(0, 0, halfWidth, height);
      renderer.setScissorTest(true);
      renderer.render(scene, camera);

      // Olho Direito
      renderer.setViewport(halfWidth - eyeShiftPixels, 0, halfWidth, height);
      renderer.setScissor(halfWidth, 0, halfWidth, height);
      renderer.setScissorTest(true);
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      renderer.setSize(window.innerWidth, window.innerHeight);
      applyCalibratedStyle();
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
