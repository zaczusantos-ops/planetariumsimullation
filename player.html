<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>AstroVR • Planetário Stellarium 360°</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      overflow: hidden;
      background-color: #010206;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      width: 100vw;
      height: 100vh;
    }
    #container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Tela Inicial / Overlay */
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(4, 7, 14, 0.95);
      backdrop-filter: blur(16px);
      color: white;
      z-index: 999;
      text-align: center;
      padding: 24px;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 8px;
      color: #00f0ff;
    }
    p {
      font-size: 14px;
      max-width: 480px;
      line-height: 1.5;
      color: #cbd5e1;
      margin-bottom: 24px;
    }
    .badge {
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid #00f0ff;
      color: #00f0ff;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 14px;
      letter-spacing: 0.5px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 320px;
      margin-bottom: 20px;
    }
    .btn {
      background: linear-gradient(135deg, #00d2ff, #0066ff);
      color: white;
      border: none;
      padding: 15px 24px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 150, 255, 0.4);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn:active { transform: scale(0.97); }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: none;
      color: #e2e8f0;
    }
    .btn-back {
      color: #94a3b8;
      font-size: 13px;
      text-decoration: none;
      transition: color 0.2s;
    }
    .btn-back:hover { color: #fff; }

    /* Barra Superior */
    .top-bar {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      pointer-events: none;
    }
    .top-bar button, .top-bar a {
      pointer-events: auto;
      background: rgba(10, 15, 25, 0.85);
      border: 1px solid rgba(0, 240, 255, 0.35);
      color: #00f0ff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    /* Moldura das Lentes Cardboard */
    .eye-frame {
      position: absolute;
      top: 0;
      width: 50vw;
      height: 100vh;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
    }
    #left-eye-frame { left: 0; }
    #right-eye-frame { right: 0; }

    .lens-mask {
      border: 2px solid rgba(0, 240, 255, 0.5);
      border-radius: 32px;
      box-shadow: 0 0 0 2000px #000;
      position: relative;
    }
    
    .divider {
      position: absolute;
      left: 50%;
      top: 0;
      width: 2px;
      height: 100%;
      background: #222;
      transform: translateX(-50%);
      z-index: 20;
      display: none;
    }
  </style>
  <!-- Three.js e Catálogo Síncrono do Stellarium -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="data/stellarium_catalog.js?v=2.7"></script>
</head>
<body>

  <!-- Barra Superior -->
  <div class="top-bar" id="top-bar" style="display: none;">
    <a href="index.html">← Sair do Planetário</a>
    <button id="toggle-vr-btn">👓 Alternar Modo VR</button>
  </div>

  <!-- Tela de Início / Overlay -->
  <div id="ui-overlay">
    <div id="sim-badge" class="badge">🪐 CÉU OFICIAL DO STELLARIUM (8.870 ESTRELAS)</div>
    <h1 id="sim-title">Planetário Astronômico 360°</h1>
    <p id="sim-desc">
      Explore o domo celeste em 360°. Para usar com óculos VR Cardboard, clique no botão azul e vire o smartphone na horizontal.
    </p>
    <div class="btn-group">
      <button class="btn" id="start-vr-btn">👓 ENTRAR NO MODO VR CARDBOARD</button>
      <button class="btn btn-secondary" id="start-mono-btn">📱 MODO TELA CHEIA (360° LIVRE)</button>
    </div>
    <a class="btn-back" href="index.html">← Voltar ao Catálogo de Simulações</a>
  </div>

  <div id="divider-line" class="divider"></div>

  <!-- Lentes Cardboard -->
  <div id="left-eye-frame" class="eye-frame">
    <div id="lens-left" class="lens-mask"></div>
  </div>
  <div id="right-eye-frame" class="eye-frame">
    <div id="lens-right" class="lens-mask"></div>
  </div>

  <div id="container"></div>

  <script>
    // 1. Catálogo Oficial de Cada Simulação (Configurações Individuais Exatas)
    const SIM_DATABASE = {
      'ioaa2019_p1': {
        title: 'IOAA 2019 • Problema 1: Céu de Keszthely',
        badge: '🇭🇺 IOAA 2019 • HUNGARY ROUND 1',
        desc: 'Céu à meia-noite em Keszthely (+46.8° N, LST = 01h 00m) com γ Cassiopeiae no meridiano superior, 3 novas de 2ª magnitude e os 8 aglomerados de Messier.',
        lat: 46.77,
        lst: 1.0,
        bortle: 2,
        sceneType: 'p1_keszthely'
      },
      'ioaa2019_p2': {
        title: 'IOAA • Desafio: Descubra a Latitude do Observador',
        badge: '🧭 DESAFIO DE LATITUDE (CÉU REAL)',
        desc: 'Localize o polo celeste visível e meça sua altitude angular acima do horizonte para descobrir a latitude e o hemisfério exatos deste local!',
        lat: -33.0,
        lst: 11.53,
        bortle: 2,
        sceneType: 'p2_latitude'
      },
      'ioaa2019_p3': {
        title: 'IOAA 2019 • Problema 3: Eclipse na Lua',
        badge: '🌕 OBSERVADOR NA LUA • ECLIPSE POR TERRA',
        desc: 'Observador em Mare Fecunditatis (0°, 50° E) vendo a Terra ocultar centralmente o Sol a 40° de altitude a Oeste com o anel atmosférico avermelhado.',
        lat: 0.0,
        lst: 14.67,
        bortle: 1,
        sceneType: 'p3_lunar'
      },
      'quando_o_segundo_sol_chegar': {
        title: 'Quando o segundo Sol chegar...',
        badge: '🪐 SISTEMA BINÁRIO SINCRONIZADO',
        desc: 'Planeta em rotação síncrona com sistema binário peculiar (Plo-I e Plo-II). As duas estrelas e o Centro de Massa oscilam sobre o meridiano local.',
        lat: 45.0,
        lst: 0.0,
        bortle: 2,
        sceneType: 'binary_system'
      }
    };

    // Parâmetros da URL
    const urlParams = new URLSearchParams(window.location.search);
    const simKey = urlParams.get('sim') || 'ioaa2019_p1';
    const isCustom = simKey === 'custom' || urlParams.has('custom_id') || urlParams.has('lat');

    let currentSim = SIM_DATABASE[simKey] || SIM_DATABASE['ioaa2019_p1'];

    if (isCustom) {
      const customLat = parseFloat(urlParams.get('lat') || '-23.5');
      const customLst = parseFloat(urlParams.get('lst') || '12');
      const customBortle = parseInt(urlParams.get('bortle') || '2');
      const customTarget = urlParams.get('target') || 'none';

      currentSim = {
        title: 'Simulação Personalizada (Maker Studio)',
        badge: `🧪 MAKER STUDIO • LAT ${customLat}° • CÉU STELLARIUM`,
        desc: `Céu customizado: Latitude ${customLat}°, LST ${customLst}h.`,
        lat: customLat,
        lst: customLst,
        bortle: customBortle,
        sceneType: 'custom_maker',
        customTarget: customTarget
      };
    }

    document.getElementById('sim-title').textContent = currentSim.title;
    document.getElementById('sim-badge').textContent = currentSim.badge;
    document.getElementById('sim-desc').textContent = currentSim.desc;

    let scene, camera, renderer;
    let isVR = false;
    let hasOrientation = false;
    let deviceOrientation = { alpha: 0, beta: 0, gamma: 0 };
    let screenOrientation = 0;

    let eyeShiftPixels = parseInt(localStorage.getItem('cardboard_shift') || '50');
    let lensSizePercent = parseInt(localStorage.getItem('cardboard_size') || '86');

    const uiOverlay = document.getElementById('ui-overlay');
    const topBar = document.getElementById('top-bar');
    const startVRBtn = document.getElementById('start-vr-btn');
    const startMonoBtn = document.getElementById('start-mono-btn');
    const toggleVRBtn = document.getElementById('toggle-vr-btn');
    const leftEyeFrame = document.getElementById('left-eye-frame');
    const rightEyeFrame = document.getElementById('right-eye-frame');
    const lensLeft = document.getElementById('lens-left');
    const lensRight = document.getElementById('lens-right');
    const dividerLine = document.getElementById('divider-line');

    function applyCalibratedStyle() {
      const sizeVal = `min(${lensSizePercent * 0.5}vw, ${lensSizePercent}vh)`;
      lensLeft.style.width = sizeVal;
      lensLeft.style.height = sizeVal;
      lensRight.style.width = sizeVal;
      lensRight.style.height = sizeVal;
    }

    // 2. Textura de Estrela Suave Perfeitamente Circular (Airy Disk)
    function createStarGlowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      grad.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
      grad.addColorStop(0.15, 'rgba(255, 255, 255, 0.95)');
      grad.addColorStop(0.40, 'rgba(255, 255, 255, 0.40)');
      grad.addColorStop(0.75, 'rgba(255, 255, 255, 0.08)');
      grad.addColorStop(1.0, 'rgba(255, 255, 255, 0.0)');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 128);

      const tex = new THREE.CanvasTexture(canvas);
      tex.needsUpdate = true;
      return tex;
    }

    // 3. Montagem do Céu Real do Stellarium em 5 Camadas de Magnitude (Escala de Pogson)
    function renderStellariumMultiTierStars(targetScene, latDeg, lstHours, bortleLevel) {
      const stars = window.STELLARIUM_STARS || [];
      if (!stars || stars.length === 0) {
        console.warn("Catálogo Stellarium não encontrado na memória.");
        return;
      }

      const bortleMagLimits = { 1: 6.5, 2: 6.0, 3: 5.5, 4: 5.0, 5: 4.5, 6: 4.0, 7: 3.5, 8: 2.8, 9: 2.0 };
      const mLim = bortleMagLimits[bortleLevel] || 6.0;

      const latRad = THREE.MathUtils.degToRad(latDeg);
      const lstRad = THREE.MathUtils.degToRad(lstHours * 15);

      // 5 Camadas de Brilho Físico
      const tiers = [
        { maxMag: 0.5, size: 28.0, positions: [], colors: [] },  // Tier 1: Sirius, Canopus, Rigel, Vega, Betelgeuse, Alpha Cen
        { maxMag: 1.8, size: 18.0, positions: [], colors: [] },  // Tier 2: Três Marias, Crux, Pólux, Castor, Spica
        { maxMag: 3.2, size: 11.0, positions: [], colors: [] },  // Tier 3: Estrelas de 2ª e 3ª magnitude
        { maxMag: 4.8, size: 6.5,  positions: [], colors: [] },  // Tier 4: Estrelas fracas
        { maxMag: 6.5, size: 3.8,  positions: [], colors: [] }   // Tier 5: Limite de visão a olho nu
      ];

      stars.forEach(s => {
        const raDeg = s[0];
        const decDeg = s[1];
        const mag = s[2];
        const rVal = s[3], gVal = s[4], bVal = s[5];

        if (mag <= mLim) {
          const raRad = THREE.MathUtils.degToRad(raDeg);
          const decRad = THREE.MathUtils.degToRad(decDeg);

          const H = lstRad - raRad;
          const sinAlt = Math.sin(latRad) * Math.sin(decRad) + Math.cos(latRad) * Math.cos(decRad) * Math.cos(H);
          const alt = Math.asin(Math.max(-1, Math.min(1, sinAlt)));

          if (alt > -0.01) {
            const y = -Math.cos(decRad) * Math.sin(H);
            const x = Math.sin(decRad) * Math.cos(latRad) - Math.cos(decRad) * Math.sin(latRad) * Math.cos(H);
            const az = Math.atan2(y, x);

            const r = 400;
            const px = r * Math.cos(alt) * Math.sin(az);
            const py = r * Math.sin(alt);
            const pz = r * Math.cos(alt) * Math.cos(az);

            // Determinar em qual camada a estrela se encaixa
            let targetTier = tiers[4];
            for (let i = 0; i < tiers.length; i++) {
              if (mag <= tiers[i].maxMag) {
                targetTier = tiers[i];
                break;
              }
            }

            targetTier.positions.push(px, py, pz);

            // Escala de brilho por Pogson
            const intensity = Math.max(0.5, 1.4 * Math.pow(10.0, -0.16 * mag));
            targetTier.colors.push(rVal * intensity, gVal * intensity, bVal * intensity);
          }
        }
      });

      const starTexture = createStarGlowTexture();

      // Criar a malha de pontos de cada camada
      tiers.forEach(tier => {
        if (tier.positions.length > 0) {
          const geo = new THREE.BufferGeometry();
          geo.setAttribute('position', new THREE.Float32BufferAttribute(tier.positions, 3));
          geo.setAttribute('color', new THREE.Float32BufferAttribute(tier.colors, 3));

          const mat = new THREE.PointsMaterial({
            size: tier.size,
            map: starTexture,
            vertexColors: true,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          });

          const mesh = new THREE.Points(geo, mat);
          targetScene.add(mesh);
        }
      });
    }

       // Global list of per‑frame animation callbacks — must be declared first
    const animationCallbacks = [];

    // --- CENÁRIOS INDIVIDUAIS ESPECÍFICOS DE CADA SIMULAÇÃO ---

    // 1. IOAA Problema 1: Keszthely (Hungria, Outubro, Lat +46.8°, LST 01h 00m)
    function buildSceneKeszthely(scene) {
      // Arco do Meridiano Celeste Local (Norte → Zênite → Sul)
      const linePts = [];
      for (let a = 0; a <= Math.PI; a += 0.03) {
        linePts.push(new THREE.Vector3(0, 390 * Math.sin(a), 390 * Math.cos(a)));
      }
      const lineGeo = new THREE.BufferGeometry().setFromPoints(linePts);
      const lineMat = new THREE.LineBasicMaterial({ color: 0x00f0ff, linewidth: 2, transparent: true, opacity: 0.6 });
      
      const meridianGroup = new THREE.Group();
      meridianGroup.add(new THREE.Line(lineGeo, lineMat));
      scene.add(meridianGroup);
      // Rotação lenta para simular rotação da esfera celeste
      animationCallbacks.push(() => { meridianGroup.rotation.y += 0.0004; });

      // 3 Novas com anéis indicadores (Pegasus, Cygnus, Auriga)
      const novaPositions = [
        new THREE.Vector3(140, 270, -250),
        new THREE.Vector3(-80, 310, -210),
        new THREE.Vector3(260, 180, 200)
      ];
      novaPositions.forEach(pos => {
        const novaMesh = new THREE.Mesh(
          new THREE.SphereGeometry(3.5, 16, 16),
          new THREE.MeshBasicMaterial({ color: 0xff4422 })
        );
        novaMesh.position.copy(pos);
        scene.add(novaMesh);

        const ringMesh = new THREE.Mesh(
          new THREE.RingGeometry(8, 10, 32),
          new THREE.MeshBasicMaterial({ color: 0xff3300, side: THREE.DoubleSide })
        );
        ringMesh.position.copy(pos);
        ringMesh.lookAt(0, 0, 0);
        scene.add(ringMesh);
      });

      // 8 Aglomerados de Messier
      [
        new THREE.Vector3(80, 220, -280), new THREE.Vector3(-140, 290, -180),
        new THREE.Vector3(120, 240, -260), new THREE.Vector3(90, 80, -350),
        new THREE.Vector3(-50, 300, -210), new THREE.Vector3(-20, 280, -240),
        new THREE.Vector3(60, 140, -320),  new THREE.Vector3(-110, 320, -150)
      ].forEach(pos => {
        const mMesh = new THREE.Mesh(
          new THREE.SphereGeometry(4.5, 12, 12),
          new THREE.MeshBasicMaterial({ color: 0x88ccff, transparent: true, opacity: 0.55 })
        );
        mMesh.position.copy(pos);
        scene.add(mMesh);
      });
    }

    // 2. IOAA Problema 2: Desafio de Latitude (Lat -33.0° S)
    function buildSceneLatitudeChallenge(scene) {
      const cometGroup = new THREE.Group();
      scene.add(cometGroup);
      const cometData = [
        { pos: new THREE.Vector3(150, 210, 280), tailDir: new THREE.Vector3(0.3, 0.8, -0.5) },
        { pos: new THREE.Vector3(-220, 260, 140), tailDir: new THREE.Vector3(-0.4, 0.7, -0.4) },
        { pos: new THREE.Vector3(260, 120, -200), tailDir: new THREE.Vector3(0.5, 0.6, 0.5) }
      ];

      cometData.forEach(c => {
        const head = new THREE.Mesh(
          new THREE.SphereGeometry(3.8, 16, 16),
          new THREE.MeshBasicMaterial({ color: 0x88ffff })
        );
        head.position.copy(c.pos);
        cometGroup.add(head);

        const tailPts = [c.pos.clone(), c.pos.clone().add(c.tailDir.clone().multiplyScalar(45))];
        cometGroup.add(new THREE.Line(
          new THREE.BufferGeometry().setFromPoints(tailPts),
          new THREE.LineBasicMaterial({ color: 0x44ccff, linewidth: 3, transparent: true, opacity: 0.75 })
        ));
      });

      animationCallbacks.push(() => { cometGroup.rotation.y += 0.001; });
    }

    // 3. IOAA Problema 3: Observador na Lua (Eclipse Solar por Terra)
    function buildSceneLunarEclipse(scene) {
      const moonTerrain = new THREE.Mesh(
        new THREE.RingGeometry(20, 390, 64),
        new THREE.MeshBasicMaterial({ color: 0x22252c, side: THREE.DoubleSide })
      );
      moonTerrain.rotation.x = Math.PI / 2;
      moonTerrain.position.y = -1.2;
      scene.add(moonTerrain);

      const earthAltRad = THREE.MathUtils.degToRad(40);
      const earthAzRad  = THREE.MathUtils.degToRad(270);
      const earthR = 380;
      const earthPos = new THREE.Vector3(
        earthR * Math.cos(earthAltRad) * Math.sin(earthAzRad),
        earthR * Math.sin(earthAltRad),
        earthR * Math.cos(earthAltRad) * Math.cos(earthAzRad)
      );

      const earthMesh = new THREE.Mesh(
        new THREE.SphereGeometry(18, 32, 32),
        new THREE.MeshBasicMaterial({ color: 0x050810 })
      );
      earthMesh.position.copy(earthPos);
      scene.add(earthMesh);

      const ringMesh = new THREE.Mesh(
        new THREE.RingGeometry(18.2, 22.5, 64),
        new THREE.MeshBasicMaterial({ color: 0xff3300, side: THREE.DoubleSide, transparent: true, opacity: 0.95 })
      );
      ringMesh.position.copy(earthPos);
      ringMesh.lookAt(0, 0, 0);
      scene.add(ringMesh);

      const junoMesh = new THREE.Mesh(
        new THREE.SphereGeometry(2.8, 12, 12),
        new THREE.MeshBasicMaterial({ color: 0xeeeeaa })
      );
      junoMesh.position.set(earthPos.x + 35, earthPos.y - 15, earthPos.z + 20);
      scene.add(junoMesh);

      animationCallbacks.push(() => {
        earthMesh.rotation.y += 0.0008;
        ringMesh.rotation.y += 0.0008;
        junoMesh.rotation.y += 0.0008;
      });
    }

    // 4. Sistema Binário Sincronizado (Quando o segundo Sol chegar)
    function buildSceneBinarySystem(scene) {
      // Meridiano de referência
      const linePts = [];
      for (let a = 0; a <= Math.PI; a += 0.03) {
        linePts.push(new THREE.Vector3(0, 390 * Math.sin(a), 390 * Math.cos(a)));
      }
      scene.add(new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(linePts),
        new THREE.LineBasicMaterial({ color: 0x00f0ff, linewidth: 2, transparent: true, opacity: 0.5 })
      ));

      const plo1 = new THREE.Mesh(
        new THREE.SphereGeometry(10, 24, 24),
        new THREE.MeshBasicMaterial({ color: 0xffaa00 })
      );
      scene.add(plo1);

      const plo2 = new THREE.Mesh(
        new THREE.SphereGeometry(7, 24, 24),
        new THREE.MeshBasicMaterial({ color: 0x00d2ff })
      );
      scene.add(plo2);

      // Centro de Massa (fixo)
      const com = new THREE.Mesh(
        new THREE.SphereGeometry(2.5, 12, 12),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
      );
      com.position.set(0, 278, 214);
      scene.add(com);

      // Órbita binária animada ao redor do centro de massa
      const binaryRadius = 40;
      let binaryAngle = 0;
      const cx = com.position.x, cy = com.position.y, cz = com.position.z;
      animationCallbacks.push(() => {
        binaryAngle += 0.0015;
        plo1.position.set(
          cx + binaryRadius * Math.cos(binaryAngle),
          cy + 8,
          cz + binaryRadius * Math.sin(binaryAngle)
        );
        plo2.position.set(
          cx - binaryRadius * 0.6 * Math.cos(binaryAngle),
          cy - 5,
          cz - binaryRadius * 0.6 * Math.sin(binaryAngle)
        );
      });
    }

    // 5. Maker Studio Customizado
    function buildSceneCustomMaker(scene, customTarget) {
      if (customTarget === 'nova') {
        const novaGeo = new THREE.SphereGeometry(4.5, 16, 16);
        const novaMat = new THREE.MeshBasicMaterial({ color: 0xff3300 });
        const nova = new THREE.Mesh(novaGeo, novaMat);
        nova.position.set(120, 260, -220);
        scene.add(nova);

        const ringGeo = new THREE.RingGeometry(9, 11, 32);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xff3300, side: THREE.DoubleSide });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.position.set(120, 260, -220);
        ring.lookAt(0, 0, 0);
        scene.add(ring);
      } else if (customTarget === 'meridian') {
        const linePts = [];
        for (let a = 0; a <= Math.PI; a += 0.04) {
          linePts.push(new THREE.Vector3(0, 385 * Math.sin(a), 385 * Math.cos(a)));
        }
        const lineGeo = new THREE.BufferGeometry().setFromPoints(linePts);
        const lineMat = new THREE.LineBasicMaterial({ color: 0x00f0ff, linewidth: 2 });
        scene.add(new THREE.Line(lineGeo, lineMat));
      } else if (customTarget === 'comet') {
        const headGeo = new THREE.SphereGeometry(4, 16, 16);
        const head = new THREE.Mesh(headGeo, new THREE.MeshBasicMaterial({ color: 0x88ffff }));
        head.position.set(160, 230, 200);
        scene.add(head);

        const tailPts = [new THREE.Vector3(160, 230, 200), new THREE.Vector3(190, 280, 160)];
        scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(tailPts), new THREE.LineBasicMaterial({ color: 0x44ccff, linewidth: 3 })));
      } else if (customTarget === 'eclipse') {
        buildSceneLunarEclipse(scene);
      }
    }

    // 4. Inicialização do Motor WebGL
    function init() {
      const container = document.getElementById('container');
      
      scene = new THREE.Scene();
      // Reset per‑frame callbacks for the new simulation
      animationCallbacks.length = 0;
      scene.background = new THREE.Color(0x010206);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 0.01);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputEncoding = THREE.sRGBEncoding;
      container.appendChild(renderer.domElement);

      // Renderizar o céu de estrelas em 5 camadas de Pogson do Stellarium
      renderStellariumMultiTierStars(scene, currentSim.lat, currentSim.lst, currentSim.bortle);

      // Renderizar os elementos únicos de cada problema
      if (currentSim.sceneType === 'p1_keszthely') {
        buildSceneKeszthely(scene);
      } else if (currentSim.sceneType === 'p2_latitude') {
        buildSceneLatitudeChallenge(scene);
      } else if (currentSim.sceneType === 'p3_lunar') {
        buildSceneLunarEclipse(scene);
      } else if (currentSim.sceneType === 'binary_system') {
        buildSceneBinarySystem(scene);
      } else if (currentSim.sceneType === 'custom_maker') {
        buildSceneCustomMaker(scene, currentSim.customTarget);
      }

      // Horizonte e Solo
      if (currentSim.sceneType !== 'p3_lunar') {
        const horizonGeo = new THREE.RingGeometry(385, 390, 64);
        const horizonMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide, opacity: 0.35, transparent: true });
        const horizon = new THREE.Mesh(horizonGeo, horizonMat);
        horizon.rotation.x = Math.PI / 2;
        scene.add(horizon);

        const groundGeo = new THREE.CircleGeometry(385, 48);
        const groundMat = new THREE.MeshBasicMaterial({ color: 0x010306, side: THREE.DoubleSide });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = Math.PI / 2;
        ground.position.y = -0.5;
        scene.add(ground);
      }

      // Suporte a Giroscópio
      window.addEventListener('deviceorientation', handleOrientation, true);
      window.addEventListener('orientationchange', handleScreenOrientation, false);
      handleScreenOrientation();

      // Suporte a Mouse / Touch para Desktop e Celular
      let isUserInteracting = false;
      let onPointerDownPointerX = 0, onPointerDownPointerY = 0;
      let lon = 0, onPointerDownLon = 0;
      let lat = 0, onPointerDownLat = 0;

      container.addEventListener('pointerdown', function(e) {
        if (hasOrientation) return;
        isUserInteracting = true;
        onPointerDownPointerX = e.clientX;
        onPointerDownPointerY = e.clientY;
        onPointerDownLon = lon;
        onPointerDownLat = lat;
      });

      document.addEventListener('pointermove', function(e) {
        if (!isUserInteracting || hasOrientation) return;
        lon = (onPointerDownPointerX - e.clientX) * 0.15 + onPointerDownLon;
        lat = (e.clientY - onPointerDownPointerY) * 0.15 + onPointerDownLat;
      });

      document.addEventListener('pointerup', function() { isUserInteracting = false; });

      window.addEventListener('resize', onWindowResize, false);

      function enterVRMode() {
        uiOverlay.style.display = 'none';
        topBar.style.display = 'flex';
        leftEyeFrame.style.display = 'flex';
        rightEyeFrame.style.display = 'flex';
        dividerLine.style.display = 'block';
        isVR = true;
        applyCalibratedStyle();

        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        }
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(() => {});
        }
        requestGyroPermission();
      }

      function enterMonoMode() {
        uiOverlay.style.display = 'none';
        topBar.style.display = 'flex';
        leftEyeFrame.style.display = 'none';
        rightEyeFrame.style.display = 'none';
        dividerLine.style.display = 'none';
        isVR = false;
        requestGyroPermission();
      }

      function requestGyroPermission() {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission()
            .then(state => {
              if (state === 'granted') {
                window.addEventListener('deviceorientation', handleOrientation, true);
              }
            }).catch(console.error);
        }
      }

      startVRBtn.addEventListener('click', enterVRMode);
      startMonoBtn.addEventListener('click', enterMonoMode);

      toggleVRBtn.addEventListener('click', () => {
        if (isVR) enterMonoMode();
        else enterVRMode();
      });

      function animate() {
        requestAnimationFrame(animate);

        if (hasOrientation) {
          updateCameraFromOrientation();
        } else {
          // Clamp latitude limits
          lat = Math.max(-85, Math.min(85, lat));
          // Auto-rotate the view slowly when the user is not interacting
          if (!isUserInteracting) {
            lon += 0.05; // adjust speed as needed
          }
          const phi = THREE.MathUtils.degToRad(90 - lat);
          const theta = THREE.MathUtils.degToRad(lon);

          const target = new THREE.Vector3();
          target.x = 500 * Math.sin(phi) * Math.cos(theta);
          target.y = 500 * Math.cos(phi);
          target.z = 500 * Math.sin(phi) * Math.sin(theta);
          camera.lookAt(target);
        }

        // Execute per-simulation animation callbacks
        animationCallbacks.forEach(cb => cb());

        renderVR();
      }

      animate();
    }

    function handleOrientation(e) {
      if (e.alpha !== null && e.beta !== null && e.gamma !== null) {
        hasOrientation = true;
        deviceOrientation = {
          alpha: THREE.MathUtils.degToRad(e.alpha || 0),
          beta: THREE.MathUtils.degToRad(e.beta || 0),
          gamma: THREE.MathUtils.degToRad(e.gamma || 0)
        };
      }
    }

    function handleScreenOrientation() {
      screenOrientation = THREE.MathUtils.degToRad(window.orientation || 0);
    }

    const zee = new THREE.Vector3(0, 0, 1);
    const euler = new THREE.Euler();
    const q0 = new THREE.Quaternion();
    const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));

    function updateCameraFromOrientation() {
      const alpha = deviceOrientation.alpha;
      const beta = deviceOrientation.beta;
      const gamma = deviceOrientation.gamma;
      const orient = screenOrientation;

      euler.set(beta, alpha, -gamma, 'YXZ');
      camera.quaternion.setFromEuler(euler);
      camera.quaternion.multiply(q1);
      camera.quaternion.multiply(q0.setFromAxisAngle(zee, -orient));
    }

    function renderVR() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const halfWidth = Math.floor(width / 2);

      if (!isVR) {
        renderer.setViewport(0, 0, width, height);
        renderer.setScissor(0, 0, width, height);
        renderer.setScissorTest(false);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.render(scene, camera);
        return;
      }

      camera.aspect = halfWidth / height;
      camera.updateProjectionMatrix();

      // Olho Esquerdo
      renderer.setViewport(0 + eyeShiftPixels, 0, halfWidth, height);
      renderer.setScissor(0, 0, halfWidth, height);
      renderer.setScissorTest(true);
      renderer.render(scene, camera);

      // Olho Direito
      renderer.setViewport(halfWidth - eyeShiftPixels, 0, halfWidth, height);
      renderer.setScissor(halfWidth, 0, halfWidth, height);
      renderer.setScissorTest(true);
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      renderer.setSize(window.innerWidth, window.innerHeight);
      applyCalibratedStyle();
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
