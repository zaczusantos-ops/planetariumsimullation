<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Simulação VR 360° - Planetário IOAA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      width: 100vw;
      height: 100vh;
    }
    #container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(4, 8, 16, 0.95);
      color: white;
      z-index: 999;
      text-align: center;
      padding: 24px;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 8px;
      color: #00f0ff;
    }
    p {
      font-size: 14px;
      max-width: 440px;
      line-height: 1.5;
      color: #c0d0e0;
      margin-bottom: 20px;
    }
    .badge {
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid #00f0ff;
      color: #00f0ff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .btn {
      background: linear-gradient(135deg, #00d2ff, #0066ff);
      color: white;
      border: none;
      padding: 16px 36px;
      font-size: 17px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 150, 255, 0.5);
      transition: all 0.2s ease;
      margin-bottom: 15px;
    }
    .btn:active { transform: scale(0.96); }
    .btn-back {
      background: transparent;
      border: 1px solid #4b5563;
      color: #9ca3af;
      padding: 8px 18px;
      font-size: 13px;
      border-radius: 20px;
      text-decoration: none;
    }
    
    /* Moldura das Lentes Cardboard (Sem nenhum botão em cima) */
    .eye-frame {
      position: absolute;
      top: 0;
      width: 50vw;
      height: 100vh;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
    }
    #left-eye-frame { left: 0; }
    #right-eye-frame { left: 50vw; }

    .lens-cutout {
      border-radius: 50px;
      box-shadow: 0 0 0 9999px #000000;
      border: 2px solid rgba(0, 240, 255, 0.25);
    }

    #divider-line {
      position: absolute;
      left: 50%;
      top: 0;
      width: 6px;
      height: 100%;
      background: #000;
      transform: translateX(-50%);
      z-index: 15;
      pointer-events: none;
      display: none;
    }

    /* Botão flutuante sutil de retorno ao Hub (aparece apenas ao tocar na tela) */
    #quick-back-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid #444;
      color: #aaa;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      text-decoration: none;
      z-index: 50;
      display: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="container"></div>

  <!-- Lentes Cardboard 100% Desobstruídas -->
  <div id="left-eye-frame" class="eye-frame">
    <div id="lens-left" class="lens-cutout"></div>
  </div>
  <div id="right-eye-frame" class="eye-frame">
    <div id="lens-right" class="lens-cutout"></div>
  </div>

  <div id="divider-line"></div>
  <a id="quick-back-btn" href="index.html">⬅ Calibrar / Hub</a>

  <div id="ui-overlay">
    <div id="sim-badge" class="badge">🥽 MODO IMERSIVO 100% LIMPO</div>
    <h1 id="sim-title">Carregando Simulação...</h1>
    <p id="sim-desc">
      As configurações de <strong>convergência e tamanho de lente</strong> calibradas no Hub serão aplicadas automaticamente para uma visualização sem obstruções.
    </p>
    <button id="start-btn" class="btn">👓 INICIAR NO CARDBOARD</button>
    <br>
    <a href="index.html" class="btn-back">⬅ Voltar ao Hub</a>
  </div>

  <video id="video-source" loop crossOrigin="anonymous" playsinline webkit-playsinline style="display:none;">
    <source id="video-src" src="output_videos/quando_o_segundo_sol_chegar_VR360.mp4" type="video/mp4">
  </video>

  <script>
    // Catálogo de Simulações
    const SIM_DATABASE = {
      'ioaa2019_p1': {
        title: 'IOAA 2019 • Problema 1: Céu de Keszthely',
        badge: '🇭🇺 IOAA 2019 • HUNGARY ROUND 1',
        desc: 'Céu à meia-noite em Keszthely (LST = 01h 00m) com γ Cassiopeiae no meridiano, 3 novas de 2ª magnitude e os 8 aglomerados de Messier.',
        video: 'output_videos/ioaa2019_p1_keszthely_VR360.mp4'
      },
      'ioaa2019_p2': {
        title: 'IOAA • Desafio: Descubra a Latitude do Observador',
        badge: '🧭 DESAFIO DE LATITUDE (CÉU REAL)',
        desc: 'Localize o polo celeste visível e meça sua altitude angular acima do horizonte para descobrir a latitude e o hemisfério exatos deste local!',
        video: 'output_videos/ioaa2019_p2_latitude25s_VR360.mp4'
      },
      'ioaa2019_p3': {
        title: 'IOAA 2019 • Problema 3: Eclipse na Lua',
        badge: '🌕 IOAA 2019 • HUNGARY ROUND 3',
        desc: 'Observador em Mare Fecunditatis (0°, 50° E) vendo a Terra ocultar centralmente o Sol a 40° de altitude a Oeste, com Juno a 3 UA do Sol.',
        video: 'output_videos/ioaa2019_p3_lunar_eclipse_VR360.mp4'
      },
      'quando_o_segundo_sol_chegar': {
        title: 'Quando o segundo Sol chegar...',
        badge: '🪐 SISTEMA BINÁRIO SINCRONIZADO',
        desc: 'Planeta em rotação síncrona com sistema binário peculiar (Plo-I e Plo-II). As duas estrelas e o Centro de Massa oscilam sobre o meridiano local.',
        video: 'output_videos/quando_o_segundo_sol_chegar_VR360.mp4'
      }
    };

    // Obter parâmetro da URL
    const urlParams = new URLSearchParams(window.location.search);
    const simKey = urlParams.get('sim') || 'ioaa2019_p1';
    const currentSim = SIM_DATABASE[simKey] || SIM_DATABASE['ioaa2019_p1'];

    document.getElementById('sim-title').textContent = currentSim.title;
    document.getElementById('sim-badge').textContent = currentSim.badge;
    document.getElementById('sim-desc').textContent = currentSim.desc;
    document.getElementById('video-src').src = currentSim.video;

    let scene, camera, renderer, video, texture, mesh;
    let isVR = false;
    let hasOrientation = false;
    let deviceOrientation = { alpha: 0, beta: 0, gamma: 0 };
    let screenOrientation = 0;

    // Carregar configurações de calibração salvas no Hub
    let eyeShiftPixels = parseInt(localStorage.getItem('cardboard_shift') || '50');
    let lensSizePercent = parseInt(localStorage.getItem('cardboard_size') || '86');

    const startBtn = document.getElementById('start-btn');
    const uiOverlay = document.getElementById('ui-overlay');
    const leftEyeFrame = document.getElementById('left-eye-frame');
    const rightEyeFrame = document.getElementById('right-eye-frame');
    const lensLeft = document.getElementById('lens-left');
    const lensRight = document.getElementById('lens-right');
    const dividerLine = document.getElementById('divider-line');
    const quickBackBtn = document.getElementById('quick-back-btn');
    video = document.getElementById('video-source');
    video.load();

    function applyCalibratedStyle() {
      const sizeVal = `min(${lensSizePercent * 0.5}vw, ${lensSizePercent}vh)`;
      lensLeft.style.width = sizeVal;
      lensLeft.style.height = sizeVal;
      lensRight.style.width = sizeVal;
      lensRight.style.height = sizeVal;
    }

    function init() {
      const container = document.getElementById('container');
      
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.autoClear = false;
      container.appendChild(renderer.domElement);

      texture = new THREE.VideoTexture(video);
      texture.generateMipmaps = false;
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.format = THREE.RGBFormat;

      const geometry = new THREE.SphereGeometry(500, 64, 48);
      geometry.scale(-1, 1, 1);
      const material = new THREE.MeshBasicMaterial({ map: texture });
      mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);

      setupTouchControls();
      applyCalibratedStyle();
      window.addEventListener('resize', onWindowResize);
      window.addEventListener('orientationchange', () => { screenOrientation = window.orientation || 0; });
      screenOrientation = window.orientation || 0;
    }

    function requestMotionPermission() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(state => {
          if (state === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation, true);
            hasOrientation = true;
          }
        }).catch(console.error);
      } else if ('DeviceOrientationEvent' in window) {
        window.addEventListener('deviceorientation', handleOrientation, true);
        hasOrientation = true;
      }
    }

    function handleOrientation(e) {
      if (e.alpha !== null && e.beta !== null && e.gamma !== null) {
        hasOrientation = true;
        deviceOrientation.alpha = e.alpha;
        deviceOrientation.beta = e.beta;
        deviceOrientation.gamma = e.gamma;
      }
    }

    const zee = new THREE.Vector3(0, 0, 1);
    const euler = new THREE.Euler();
    const q0 = new THREE.Quaternion();
    const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));

    function updateCamera() {
      if (hasOrientation && (deviceOrientation.alpha || deviceOrientation.beta || deviceOrientation.gamma)) {
        const alpha = THREE.MathUtils.degToRad(deviceOrientation.alpha);
        const beta = THREE.MathUtils.degToRad(deviceOrientation.beta);
        const gamma = THREE.MathUtils.degToRad(deviceOrientation.gamma);
        const orient = THREE.MathUtils.degToRad(screenOrientation);

        euler.set(beta, alpha, -gamma, 'YXZ');
        camera.quaternion.setFromEuler(euler);
        camera.quaternion.multiply(q1);
        camera.quaternion.multiply(q0.setFromAxisAngle(zee, -orient));
      } else {
        lat = Math.max(-85, Math.min(85, lat));
        phi = THREE.MathUtils.degToRad(90 - lat);
        theta = THREE.MathUtils.degToRad(lon);
        const target = new THREE.Vector3();
        target.x = Math.sin(phi) * Math.cos(theta);
        target.y = Math.cos(phi);
        target.z = Math.sin(phi) * Math.sin(theta);
        camera.lookAt(target);
      }
    }

    let lon = 0, lat = 0, phi = 0, theta = 0;
    let touchStartX = 0, touchStartY = 0;

    function setupTouchControls() {
      let isDragging = false;
      window.addEventListener('mousedown', e => { 
        if (e.target.tagName === 'A' || e.target.tagName === 'BUTTON') return;
        isDragging = true; touchStartX = e.clientX; touchStartY = e.clientY; 
      });
      window.addEventListener('mousemove', e => {
        if (isDragging) {
          lon -= (e.clientX - touchStartX) * 0.2;
          lat += (e.clientY - touchStartY) * 0.2;
          touchStartX = e.clientX; touchStartY = e.clientY;
        }
      });
      window.addEventListener('mouseup', () => isDragging = false);

      window.addEventListener('touchstart', e => {
        if (e.target.tagName === 'A' || e.target.tagName === 'BUTTON') return;
        if (e.touches.length === 1) {
          touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
          quickBackBtn.style.display = 'block';
          setTimeout(() => { quickBackBtn.style.display = 'none'; }, 4000);
        }
      });
      window.addEventListener('touchmove', e => {
        if (e.target.tagName === 'A' || e.target.tagName === 'BUTTON') return;
        if (e.touches.length === 1 && !hasOrientation) {
          lon -= (e.touches[0].clientX - touchStartX) * 0.25;
          lat += (e.touches[0].clientY - touchStartY) * 0.25;
          touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
        }
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      updateCamera();

      if (isVR) {
        const width = window.innerWidth;
        const height = window.innerHeight;
        const halfWidth = width / 2;

        camera.aspect = halfWidth / height;
        camera.updateProjectionMatrix();

        // 1. Olho Esquerdo: Com deslocamento calibrado de convergência
        renderer.setViewport(0 + eyeShiftPixels, 0, halfWidth, height);
        renderer.setScissor(0, 0, halfWidth, height);
        renderer.setScissorTest(true);
        renderer.render(scene, camera);

        // 2. Olho Direito: Com deslocamento calibrado de convergência (IDÊNTICO)
        renderer.setViewport(halfWidth - eyeShiftPixels, 0, halfWidth, height);
        renderer.setScissor(halfWidth, 0, halfWidth, height);
        renderer.setScissorTest(true);
        renderer.render(scene, camera);
      } else {
        renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
        renderer.setScissorTest(false);
        renderer.render(scene, camera);
      }
    }

    startBtn.addEventListener('click', () => {
      isVR = true;
      uiOverlay.style.display = 'none';
      leftEyeFrame.style.display = 'flex';
      rightEyeFrame.style.display = 'flex';
      dividerLine.style.display = 'block';

      video.play().catch(e => console.log("Play error:", e));
      requestMotionPermission();

      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else if (document.documentElement.webkitRequestFullscreen) {
        document.documentElement.webkitRequestFullscreen();
      }

      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
    });

    init();
    animate();
  </script>
</body>
</html>
