<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>AstroVR Planetario 360</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; background: #010206; font-family: sans-serif; user-select: none; width: 100vw; height: 100vh; }
    #container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    #ui-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      background: rgba(4,7,14,0.95); backdrop-filter: blur(16px);
      color: white; z-index: 999; text-align: center; padding: 24px;
    }
    h1 { font-size: 22px; margin-bottom: 8px; color: #00f0ff; }
    p { font-size: 14px; max-width: 480px; line-height: 1.5; color: #cbd5e1; margin-bottom: 24px; }
    .badge { background: rgba(0,240,255,0.15); border: 1px solid #00f0ff; color: #00f0ff; padding: 4px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; margin-bottom: 14px; }
    .btn-group { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; margin-bottom: 20px; }
    .btn { background: linear-gradient(135deg, #00d2ff, #0066ff); color: white; border: none; padding: 15px 24px; font-size: 15px; font-weight: 700; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 20px rgba(0,150,255,0.4); }
    .btn-secondary { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); box-shadow: none; color: #e2e8f0; }
    .btn-back { color: #94a3b8; font-size: 13px; text-decoration: none; }
    .top-bar { position: absolute; top: 14px; left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; pointer-events: none; }
    .top-bar button, .top-bar a { pointer-events: auto; background: rgba(10,15,25,0.85); border: 1px solid rgba(0,240,255,0.35); color: #00f0ff; padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: bold; text-decoration: none; cursor: pointer; }
    .eye-frame { position: absolute; top: 0; width: 50vw; height: 100vh; display: none; align-items: center; justify-content: center; pointer-events: none; z-index: 10; overflow: hidden; }
    #left-eye-frame { left: 0; } #right-eye-frame { right: 0; }
    .lens-mask { border: 2px solid rgba(0,240,255,0.5); border-radius: 32px; box-shadow: 0 0 0 2000px #000; position: relative; }
    .divider { position: absolute; left: 50%; top: 0; width: 2px; height: 100%; background: #222; transform: translateX(-50%); z-index: 20; display: none; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="data/stellarium_catalog.js?v=2.9"></script>
</head>
<body>
  <div class="top-bar" id="top-bar" style="display:none;">
    <a href="index.html">&larr; Voltar</a>
    <button id="toggle-vr-btn">Alternar VR</button>
  </div>
  <div id="ui-overlay">
    <div id="sim-badge" class="badge">Stellarium 8870 Stars</div>
    <h1 id="sim-title">Planetario 360</h1>
    <p id="sim-desc">Clique para iniciar</p>
    <div class="btn-group">
      <button class="btn" id="start-vr-btn">VR CARDBOARD</button>
      <button class="btn btn-secondary" id="start-mono-btn">TELA CHEIA 360</button>
    </div>
    <a class="btn-back" href="index.html">&larr; Voltar ao catalogo</a>
  </div>
  <div id="divider-line" class="divider"></div>
  <div id="left-eye-frame" class="eye-frame"><div id="lens-left" class="lens-mask"></div></div>
  <div id="right-eye-frame" class="eye-frame"><div id="lens-right" class="lens-mask"></div></div>
  <div id="container"></div>

  <script>
    /* jshint esversion: 5 */
    // ---- SIM DATABASE ----
    var SIM_DB = {
      ioaa2019_p1: {
        title: "IOAA 2019 Problema 1: Keszthely", badge: "IOAA 2019 Hungary",
        desc: "Ceu a meia-noite em Keszthely +46.8 N LST 1h",
        lat: 46.77, lst: 1.0, bortle: 2, type: "keszthely"
      },
      ioaa2019_p2: {
        title: "IOAA Desafio: Descubra a Latitude", badge: "Desafio Latitude",
        desc: "Localize o polo celeste e meca sua altitude",
        lat: -33.0, lst: 11.53, bortle: 2, type: "latitude"
      },
      ioaa2019_p3: {
        title: "IOAA 2019 Problema 3: Eclipse na Lua", badge: "Observador Lunar",
        desc: "Terra eclipsando o Sol visto da Lua",
        lat: 0.0, lst: 14.67, bortle: 1, type: "lunar"
      },
      quando_o_segundo_sol_chegar: {
        title: "Quando o segundo Sol chegar", badge: "Sistema Binario",
        desc: "Plo-I e Plo-II orbitam o centro de massa",
        lat: 45.0, lst: 0.0, bortle: 2, type: "binary"
      }
    };

    var p = new URLSearchParams(window.location.search);
    var key = p.get("sim") || "ioaa2019_p1";
    var sim = SIM_DB[key] || SIM_DB["ioaa2019_p1"];
    if (p.has("lat")) {
      sim = {
        title: "Maker Studio", badge: "Custom", desc: "Ceu customizado",
        lat: parseFloat(p.get("lat") || "-23.5"),
        lst: parseFloat(p.get("lst") || "12"),
        bortle: parseInt(p.get("bortle") || "2"),
        type: "custom",
        target: p.get("target") || ""
      };
    }

    document.getElementById("sim-title").textContent = sim.title;
    document.getElementById("sim-badge").textContent = sim.badge;
    document.getElementById("sim-desc").textContent  = sim.desc;

    // ---- GLOBALS ----
    var scene, camera, renderer;
    var isVR = false;
    var lat = 0, lon = 180, isInteracting = false;
    var hasGyro = false;
    var gyro = { a: 0, b: 0, g: 0 };
    var screenOri = 0;
    var EYE_SHIFT = 20;
    var animCBs = [];

    // ---- STAR TEXTURE ----
    function makeStarTexture() {
      var c = document.createElement("canvas");
      c.width = 64; c.height = 64;
      var ctx = c.getContext("2d");
      var grd = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      grd.addColorStop(0,    "rgba(255,255,255,1)");
      grd.addColorStop(0.3,  "rgba(255,255,255,0.8)");
      grd.addColorStop(0.7,  "rgba(255,255,255,0.1)");
      grd.addColorStop(1,    "rgba(255,255,255,0)");
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, 64, 64);
      var t = new THREE.CanvasTexture(c);
      t.needsUpdate = true;
      return t;
    }

    // ---- RENDER STELLARIUM STARS ----
    function buildStars(sc, obsLat, lst, bortle) {
      if (typeof STELLARIUM_CATALOG === "undefined") { console.warn("No catalog"); return; }
      var bf     = Math.max(0.3, 1.0 - (bortle - 1) * 0.08);
      var latR   = THREE.MathUtils.degToRad(obsLat);
      var maxMag = bortle <= 3 ? 9.5 : bortle <= 5 ? 8.0 : bortle <= 7 ? 6.5 : 5.5;
      var R      = 500;
      var tiers  = [
        { max: 1.5,  sz: 9.0, pos: [], col: [] },
        { max: 3.0,  sz: 5.5, pos: [], col: [] },
        { max: 5.0,  sz: 3.5, pos: [], col: [] },
        { max: 7.0,  sz: 2.2, pos: [], col: [] },
        { max: 10.0, sz: 1.4, pos: [], col: [] }
      ];

      for (var si = 0; si < STELLARIUM_CATALOG.length; si++) {
        var s = STELLARIUM_CATALOG[si];
        if (s.mag > maxMag) continue;
        var raR  = THREE.MathUtils.degToRad(s.ra  * 15);
        var decR = THREE.MathUtils.degToRad(s.dec);
        var lstR = THREE.MathUtils.degToRad(lst   * 15);
        var ha   = lstR - raR;
        var sinA = Math.sin(latR) * Math.sin(decR) + Math.cos(latR) * Math.cos(decR) * Math.cos(ha);
        sinA = Math.max(-1, Math.min(1, sinA));
        var alt  = Math.asin(sinA);
        if (alt < THREE.MathUtils.degToRad(-5)) continue;
        var cosAlt = Math.cos(alt);
        var cosAz  = cosAlt > 0.0001 ? (Math.sin(decR) - Math.sin(latR) * sinA) / (Math.cos(latR) * cosAlt) : 0;
        cosAz = Math.max(-1, Math.min(1, cosAz));
        var az = Math.acos(cosAz);
        if (Math.sin(ha) > 0) az = 2 * Math.PI - az;
        var px = R * cosAlt * Math.sin(az);
        var py = R * sinA;
        var pz = R * cosAlt * Math.cos(az);

        var bv = (s.bv !== undefined && s.bv !== null) ? s.bv : 0.6;
        var rv, gv, bv2;
        if      (bv < -0.3) { rv=0.63; gv=0.71; bv2=1.0; }
        else if (bv <  0.0) { rv=0.75; gv=0.85; bv2=1.0; }
        else if (bv <  0.3) { rv=0.95; gv=0.97; bv2=1.0; }
        else if (bv <  0.6) { rv=1.0;  gv=1.0;  bv2=0.95; }
        else if (bv <  1.0) { rv=1.0;  gv=0.87; bv2=0.7; }
        else if (bv <  1.4) { rv=1.0;  gv=0.70; bv2=0.4; }
        else                { rv=1.0;  gv=0.55; bv2=0.25; }

        var intensity = bf * Math.max(0.4, 1.5 * Math.pow(10, -0.16 * s.mag));
        var tier = tiers[tiers.length - 1];
        for (var ti = 0; ti < tiers.length; ti++) {
          if (s.mag <= tiers[ti].max) { tier = tiers[ti]; break; }
        }
        tier.pos.push(px, py, pz);
        tier.col.push(rv * intensity, gv * intensity, bv2 * intensity);
      }

      var tex = makeStarTexture();
      for (var i = 0; i < tiers.length; i++) {
        var tier = tiers[i];
        if (!tier.pos.length) continue;
        var geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.Float32BufferAttribute(tier.pos, 3));
        geo.setAttribute("color",    new THREE.Float32BufferAttribute(tier.col, 3));
        sc.add(new THREE.Points(geo, new THREE.PointsMaterial({
          size: tier.sz, map: tex, vertexColors: true, transparent: true,
          blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: false
        })));
      }
      console.log("Stars rendered:", STELLARIUM_CATALOG.length);
    }

    // ---- SCENE BUILDERS ----
    function buildKeszthely(sc) {
      var pts = [];
      for (var a = 0; a <= Math.PI; a += 0.03)
        pts.push(new THREE.Vector3(0, 390 * Math.sin(a), 390 * Math.cos(a)));
      var mg = new THREE.Group();
      mg.add(new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.6 })
      ));
      sc.add(mg);
      animCBs.push(function() { mg.rotation.y += 0.0004; });

      var novaPos = [[140,270,-250], [-80,310,-210], [260,180,200]];
      for (var i = 0; i < novaPos.length; i++) {
        var np = novaPos[i];
        var nv = new THREE.Mesh(new THREE.SphereGeometry(3.5,16,16), new THREE.MeshBasicMaterial({color:0xff4422}));
        nv.position.set(np[0],np[1],np[2]); sc.add(nv);
        var rg = new THREE.Mesh(new THREE.RingGeometry(8,10,32), new THREE.MeshBasicMaterial({color:0xff3300, side:THREE.DoubleSide}));
        rg.position.set(np[0],np[1],np[2]); rg.lookAt(0,0,0); sc.add(rg);
      }

      var messier = [[80,220,-280],[-140,290,-180],[120,240,-260],[90,80,-350],[-50,300,-210],[-20,280,-240],[60,140,-320],[-110,320,-150]];
      for (var i = 0; i < messier.length; i++) {
        var mp = messier[i];
        var m = new THREE.Mesh(new THREE.SphereGeometry(4.5,12,12), new THREE.MeshBasicMaterial({color:0x88ccff, transparent:true, opacity:0.55}));
        m.position.set(mp[0],mp[1],mp[2]); sc.add(m);
      }
    }

    function buildLatitude(sc) {
      var cg = new THREE.Group();
      sc.add(cg);
      var comets = [
        { p: [150, 210, 280],   t: [13.5, 36, -22.5] },
        { p: [-220, 260, 140],  t: [-18,  31.5, -18]  },
        { p: [260, 120, -200],  t: [22.5, 27,   22.5] }
      ];
      for (var i = 0; i < comets.length; i++) {
        var c = comets[i];
        var h = new THREE.Mesh(new THREE.SphereGeometry(3.8,16,16), new THREE.MeshBasicMaterial({color:0x88ffff}));
        h.position.set(c.p[0], c.p[1], c.p[2]);
        cg.add(h);
        cg.add(new THREE.Line(
          new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(c.p[0], c.p[1], c.p[2]),
            new THREE.Vector3(c.p[0]+c.t[0], c.p[1]+c.t[1], c.p[2]+c.t[2])
          ]),
          new THREE.LineBasicMaterial({color:0x44ccff, transparent:true, opacity:0.75})
        ));
      }
      animCBs.push(function() { cg.rotation.y += 0.001; });
    }

    function buildLunar(sc) {
      var tr = new THREE.Mesh(new THREE.RingGeometry(20,390,64), new THREE.MeshBasicMaterial({color:0x22252c, side:THREE.DoubleSide}));
      tr.rotation.x = Math.PI / 2; tr.position.y = -1.2; sc.add(tr);
      var alt = THREE.MathUtils.degToRad(40);
      var az  = THREE.MathUtils.degToRad(270);
      var R   = 380;
      var ex  = R * Math.cos(alt) * Math.sin(az);
      var ey  = R * Math.sin(alt);
      var ez  = R * Math.cos(alt) * Math.cos(az);
      var earth = new THREE.Mesh(new THREE.SphereGeometry(18,32,32), new THREE.MeshBasicMaterial({color:0x050810}));
      earth.position.set(ex, ey, ez); sc.add(earth);
      var ring = new THREE.Mesh(new THREE.RingGeometry(18.2,22.5,64), new THREE.MeshBasicMaterial({color:0xff3300, side:THREE.DoubleSide, transparent:true, opacity:0.95}));
      ring.position.set(ex, ey, ez); ring.lookAt(0,0,0); sc.add(ring);
      var juno = new THREE.Mesh(new THREE.SphereGeometry(2.8,12,12), new THREE.MeshBasicMaterial({color:0xeeeeaa}));
      juno.position.set(ex+35, ey-15, ez+20); sc.add(juno);
      animCBs.push(function() { earth.rotation.y += 0.0008; ring.rotation.y += 0.0008; juno.rotation.y += 0.0008; });
    }

    function buildBinary(sc) {
      var pts = [];
      for (var a = 0; a <= Math.PI; a += 0.03)
        pts.push(new THREE.Vector3(0, 390 * Math.sin(a), 390 * Math.cos(a)));
      sc.add(new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({color:0x00f0ff, transparent:true, opacity:0.5})
      ));
      var com = new THREE.Mesh(new THREE.SphereGeometry(2.5,12,12), new THREE.MeshBasicMaterial({color:0xffffff}));
      com.position.set(0, 278, 214); sc.add(com);
      var p1 = new THREE.Mesh(new THREE.SphereGeometry(10,24,24), new THREE.MeshBasicMaterial({color:0xffaa00})); sc.add(p1);
      var p2 = new THREE.Mesh(new THREE.SphereGeometry(7,24,24),  new THREE.MeshBasicMaterial({color:0x00d2ff})); sc.add(p2);
      var cx = 0, cy = 278, cz = 214, r = 40, angle = 0;
      animCBs.push(function() {
        angle += 0.0015;
        p1.position.set(cx + r * Math.cos(angle), cy + 8,  cz + r * Math.sin(angle));
        p2.position.set(cx - r * 0.6 * Math.cos(angle), cy - 5, cz - r * 0.6 * Math.sin(angle));
      });
    }

    function buildCustom(sc, target) {
      if (target === "eclipse") { buildLunar(sc); return; }
      var cg = new THREE.Group();
      if (target === "comet") {
        var h = new THREE.Mesh(new THREE.SphereGeometry(4,16,16), new THREE.MeshBasicMaterial({color:0x88ffff}));
        h.position.set(160,230,200); cg.add(h);
        cg.add(new THREE.Line(
          new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(160,230,200), new THREE.Vector3(190,280,160)]),
          new THREE.LineBasicMaterial({color:0x44ccff})
        ));
        sc.add(cg);
        animCBs.push(function() { cg.rotation.y += 0.001; });
      } else if (target === "meridian") {
        var pts = [];
        for (var a = 0; a <= Math.PI; a += 0.04)
          pts.push(new THREE.Vector3(0, 385 * Math.sin(a), 385 * Math.cos(a)));
        cg.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color:0x00f0ff})));
        sc.add(cg);
        animCBs.push(function() { cg.rotation.y += 0.0004; });
      } else if (target === "nova") {
        var nv = new THREE.Mesh(new THREE.SphereGeometry(4.5,16,16), new THREE.MeshBasicMaterial({color:0xff3300}));
        nv.position.set(120,260,-220); sc.add(nv);
        var rg = new THREE.Mesh(new THREE.RingGeometry(9,11,32), new THREE.MeshBasicMaterial({color:0xff3300, side:THREE.DoubleSide}));
        rg.position.set(120,260,-220); rg.lookAt(0,0,0); sc.add(rg);
        animCBs.push(function() { nv.rotation.y += 0.002; });
      }
    }

    // ---- INIT ENGINE ----
    function initEngine() {
      var container = document.getElementById("container");
      while (container.firstChild) container.removeChild(container.firstChild);

      animCBs.length = 0;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x010206);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 0.01);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);

      buildStars(scene, sim.lat, sim.lst, sim.bortle);

      if      (sim.type === "keszthely") buildKeszthely(scene);
      else if (sim.type === "latitude")  buildLatitude(scene);
      else if (sim.type === "lunar")     buildLunar(scene);
      else if (sim.type === "binary")    buildBinary(scene);
      else if (sim.type === "custom")    buildCustom(scene, sim.target);

      if (sim.type !== "lunar") {
        var hz = new THREE.Mesh(
          new THREE.RingGeometry(385, 390, 64),
          new THREE.MeshBasicMaterial({color:0x00f0ff, side:THREE.DoubleSide, opacity:0.35, transparent:true})
        );
        hz.rotation.x = Math.PI / 2; scene.add(hz);
        var gr = new THREE.Mesh(
          new THREE.CircleGeometry(385, 48),
          new THREE.MeshBasicMaterial({color:0x080c10, side:THREE.DoubleSide})
        );
        gr.rotation.x = Math.PI / 2; gr.position.y = -1; scene.add(gr);
      }

      // Interaction
      var el = renderer.domElement;
      var downX = 0, downY = 0, downLon = 0, downLat = 0;
      el.addEventListener("mousedown", function(e) { isInteracting=true; downX=e.clientX; downY=e.clientY; downLon=lon; downLat=lat; });
      el.addEventListener("mousemove", function(e) { if (!isInteracting) return; lon=(downX-e.clientX)*0.15+downLon; lat=(e.clientY-downY)*0.15+downLat; });
      el.addEventListener("mouseup",   function()  { isInteracting=false; });
      el.addEventListener("touchstart", function(e) { e.preventDefault(); isInteracting=true; downX=e.touches[0].clientX; downY=e.touches[0].clientY; downLon=lon; downLat=lat; }, { passive: false });
      el.addEventListener("touchmove",  function(e) { e.preventDefault(); if (!isInteracting) return; lon=(downX-e.touches[0].clientX)*0.15+downLon; lat=(e.touches[0].clientY-downY)*0.15+downLat; }, { passive: false });
      el.addEventListener("touchend",   function()  { isInteracting=false; });
      window.addEventListener("resize", function() { camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    }

    // ---- ANIMATE LOOP ----
    function animate() {
      requestAnimationFrame(animate);

      if (hasGyro) {
        updateGyro();
      } else {
        lat = Math.max(-85, Math.min(85, lat));
        if (!isInteracting) lon += 0.03;
        var phi   = THREE.MathUtils.degToRad(90 - lat);
        var theta = THREE.MathUtils.degToRad(lon);
        camera.lookAt(
          500 * Math.sin(phi) * Math.cos(theta),
          500 * Math.cos(phi),
          500 * Math.sin(phi) * Math.sin(theta)
        );
      }

      for (var i = 0; i < animCBs.length; i++) animCBs[i]();

      renderFrame();
    }

    // ---- GYRO ----
    var zee2   = new THREE.Vector3(0, 0, 1);
    var euler2 = new THREE.Euler();
    var q0a    = new THREE.Quaternion();
    var q1a    = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));

    function updateGyro() {
      euler2.set(gyro.b, gyro.a, -gyro.g, "YXZ");
      camera.quaternion.setFromEuler(euler2);
      camera.quaternion.multiply(q1a);
      camera.quaternion.multiply(q0a.setFromAxisAngle(zee2, -screenOri));
    }

    window.addEventListener("deviceorientation", function(e) {
      if (e.alpha === null) return;
      hasGyro = true;
      gyro = {
        a: THREE.MathUtils.degToRad(e.alpha || 0),
        b: THREE.MathUtils.degToRad(e.beta  || 0),
        g: THREE.MathUtils.degToRad(e.gamma || 0)
      };
    }, true);
    window.addEventListener("orientationchange", function() {
      screenOri = THREE.MathUtils.degToRad(window.orientation || 0);
    });

    // ---- RENDER VR / MONO ----
    function renderFrame() {
      var w = window.innerWidth, h = window.innerHeight, hw = Math.floor(w / 2);
      if (!isVR) {
        renderer.setViewport(0, 0, w, h);
        renderer.setScissorTest(false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.render(scene, camera);
        return;
      }
      camera.aspect = hw / h;
      camera.updateProjectionMatrix();
      renderer.setScissorTest(true);
      renderer.setViewport(EYE_SHIFT, 0, hw, h);
      renderer.setScissor(0, 0, hw, h);
      renderer.render(scene, camera);
      renderer.setViewport(hw - EYE_SHIFT, 0, hw, h);
      renderer.setScissor(hw, 0, hw, h);
      renderer.render(scene, camera);
    }

    // ---- UI BUTTONS ----
    function resizeLenses() {
      var h = window.innerHeight * 0.72, w = h * 0.75;
      var ll = document.getElementById("lens-left");
      var lr = document.getElementById("lens-right");
      ll.style.width = w + "px"; ll.style.height = h + "px";
      lr.style.width = w + "px"; lr.style.height = h + "px";
    }

    function enterVR() {
      document.getElementById("ui-overlay").style.display = "none";
      document.getElementById("top-bar").style.display = "flex";
      document.getElementById("left-eye-frame").style.display = "flex";
      document.getElementById("right-eye-frame").style.display = "flex";
      document.getElementById("divider-line").style.display = "block";
      isVR = true;
      resizeLenses();
      if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function")
        DeviceOrientationEvent.requestPermission().catch(function() {});
    }

    function enterMono() {
      document.getElementById("ui-overlay").style.display = "none";
      document.getElementById("top-bar").style.display = "flex";
      document.getElementById("left-eye-frame").style.display = "none";
      document.getElementById("right-eye-frame").style.display = "none";
      document.getElementById("divider-line").style.display = "none";
      isVR = false;
    }

    document.getElementById("start-vr-btn").addEventListener("click", enterVR);
    document.getElementById("start-mono-btn").addEventListener("click", enterMono);
    document.getElementById("toggle-vr-btn").addEventListener("click", function() { if (isVR) enterMono(); else enterVR(); });

    // ---- START ----
    initEngine();
    animate();
  </script>
</body>
</html>
