<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cardboard VR 360° - Planetário IOAA</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(4, 8, 16, 0.95);
      color: white;
      z-index: 999;
      text-align: center;
      padding: 24px;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 8px;
      color: #00f0ff;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }
    p {
      font-size: 14px;
      max-width: 440px;
      line-height: 1.5;
      color: #c0d0e0;
      margin-bottom: 20px;
    }
    .btn {
      background: linear-gradient(135deg, #00d2ff, #0066ff);
      color: white;
      border: none;
      padding: 16px 36px;
      font-size: 17px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 150, 255, 0.5);
      transition: all 0.2s ease;
      margin-bottom: 15px;
    }
    .btn:active {
      transform: scale(0.96);
    }
    #divider-line {
      position: absolute;
      left: 50%;
      top: 0;
      width: 2px;
      height: 100%;
      background: rgba(255, 255, 255, 0.2);
      z-index: 10;
      pointer-events: none;
      display: none;
    }
    /* Controles de Alinhamento na Tela durante o VR */
    #vr-controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      z-index: 100;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(0, 240, 255, 0.4);
      border-radius: 30px;
      padding: 6px 16px;
      align-items: center;
      gap: 12px;
      color: #00f0ff;
      font-size: 13px;
      font-weight: bold;
    }
    .adj-btn {
      background: rgba(0, 240, 255, 0.2);
      border: 1px solid #00f0ff;
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .adj-btn:active {
      background: rgba(0, 240, 255, 0.6);
    }
    #calibration-guide {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      z-index: 100;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 20px;
      pointer-events: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="container"></div>
  <div id="divider-line"></div>
  
  <div id="calibration-guide">Ajuste os botões [-] e [+] abaixo para fundir as imagens perfeitamente</div>

  <div id="vr-controls">
    <button id="btn-narrow" class="adj-btn">◀▶</button>
    <span>Distância: <span id="offset-disp">0</span>px</span>
    <button id="btn-widen" class="adj-btn">▶◀</button>
  </div>

  <div id="ui-overlay">
    <h1>🪐 Planetário IOAA em VR Cardboard</h1>
    <p>
      Para eliminar 100% da visão dupla no seu Cardboard, o player possui <strong>ajuste óptico de convergência em tempo real</strong>.<br><br>
      Toque no botão abaixo para começar.
    </p>
    <button id="start-btn" class="btn">👓 INICIAR NO CARDBOARD</button>
  </div>

  <!-- Usando o vídeo 2D 360 nítido para garantir 0% de divergência de camadas -->
  <video id="video-source" loop crossOrigin="anonymous" playsinline webkit-playsinline style="display:none;">
    <source src="../output_videos/quando_o_segundo_sol_chegar_VR360.mp4" type="video/mp4">
  </video>

  <script>
    let scene, camera, renderer, video, texture, mesh;
    let isVR = false;
    let hasOrientation = false;
    let deviceOrientation = { alpha: 0, beta: 0, gamma: 0 };
    let screenOrientation = 0;
    
    // Deslocamento horizontal do centro óptico das lentes (Offset em pixels)
    // Permite ajustar a distância entre as duas metades para casar exatamente com as lentes físicas do Cardboard
    let opticalCenterOffset = 25; 

    const startBtn = document.getElementById('start-btn');
    const uiOverlay = document.getElementById('ui-overlay');
    const dividerLine = document.getElementById('divider-line');
    const vrControls = document.getElementById('vr-controls');
    const calibGuide = document.getElementById('calibration-guide');
    const offsetDisp = document.getElementById('offset-disp');
    const btnNarrow = document.getElementById('btn-narrow');
    const btnWiden = document.getElementById('btn-widen');
    video = document.getElementById('video-source');

    btnNarrow.addEventListener('click', (e) => {
      e.stopPropagation();
      opticalCenterOffset -= 5;
      offsetDisp.textContent = opticalCenterOffset;
    });

    btnWiden.addEventListener('click', (e) => {
      e.stopPropagation();
      opticalCenterOffset += 5;
      offsetDisp.textContent = opticalCenterOffset;
    });

    function init() {
      const container = document.getElementById('container');
      
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.autoClear = false;
      container.appendChild(renderer.domElement);

      texture = new THREE.VideoTexture(video);
      texture.generateMipmaps = false;
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.format = THREE.RGBFormat;

      // Esfera 360° completa
      const geometry = new THREE.SphereGeometry(500, 64, 48);
      geometry.scale(-1, 1, 1);
      const material = new THREE.MeshBasicMaterial({ map: texture });
      mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);

      setupTouchControls();
      window.addEventListener('resize', onWindowResize);
      window.addEventListener('orientationchange', () => { screenOrientation = window.orientation || 0; });
      screenOrientation = window.orientation || 0;
    }

    function requestMotionPermission() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(state => {
          if (state === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation, true);
            hasOrientation = true;
          }
        }).catch(console.error);
      } else if ('DeviceOrientationEvent' in window) {
        window.addEventListener('deviceorientation', handleOrientation, true);
        hasOrientation = true;
      }
    }

    function handleOrientation(e) {
      if (e.alpha !== null && e.beta !== null && e.gamma !== null) {
        hasOrientation = true;
        deviceOrientation.alpha = e.alpha;
        deviceOrientation.beta = e.beta;
        deviceOrientation.gamma = e.gamma;
      }
    }

    const zee = new THREE.Vector3(0, 0, 1);
    const euler = new THREE.Euler();
    const q0 = new THREE.Quaternion();
    const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));

    function updateCamera() {
      if (hasOrientation && (deviceOrientation.alpha || deviceOrientation.beta || deviceOrientation.gamma)) {
        const alpha = THREE.MathUtils.degToRad(deviceOrientation.alpha);
        const beta = THREE.MathUtils.degToRad(deviceOrientation.beta);
        const gamma = THREE.MathUtils.degToRad(deviceOrientation.gamma);
        const orient = THREE.MathUtils.degToRad(screenOrientation);

        euler.set(beta, alpha, -gamma, 'YXZ');
        camera.quaternion.setFromEuler(euler);
        camera.quaternion.multiply(q1);
        camera.quaternion.multiply(q0.setFromAxisAngle(zee, -orient));
      } else {
        lat = Math.max(-85, Math.min(85, lat));
        phi = THREE.MathUtils.degToRad(90 - lat);
        theta = THREE.MathUtils.degToRad(lon);
        const target = new THREE.Vector3();
        target.x = Math.sin(phi) * Math.cos(theta);
        target.y = Math.cos(phi);
        target.z = Math.sin(phi) * Math.sin(theta);
        camera.lookAt(target);
      }
    }

    let lon = 0, lat = 0, phi = 0, theta = 0;
    let touchStartX = 0, touchStartY = 0;

    function setupTouchControls() {
      let isDragging = false;
      window.addEventListener('mousedown', e => { 
        if (e.target.tagName === 'BUTTON') return;
        isDragging = true; touchStartX = e.clientX; touchStartY = e.clientY; 
      });
      window.addEventListener('mousemove', e => {
        if (isDragging) {
          lon -= (e.clientX - touchStartX) * 0.2;
          lat += (e.clientY - touchStartY) * 0.2;
          touchStartX = e.clientX; touchStartY = e.clientY;
        }
      });
      window.addEventListener('mouseup', () => isDragging = false);

      window.addEventListener('touchstart', e => {
        if (e.target.tagName === 'BUTTON') return;
        if (e.touches.length === 1) {
          touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
        }
      });
      window.addEventListener('touchmove', e => {
        if (e.target.tagName === 'BUTTON') return;
        if (e.touches.length === 1 && !hasOrientation) {
          lon -= (e.touches[0].clientX - touchStartX) * 0.25;
          lat += (e.touches[0].clientY - touchStartY) * 0.25;
          touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
        }
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      updateCamera();

      if (isVR) {
        const width = window.innerWidth;
        const height = window.innerHeight;
        const halfWidth = width / 2;

        camera.aspect = halfWidth / height;
        camera.updateProjectionMatrix();

        // Render Olho Esquerdo (com deslocamento para casar com a lente esquerda)
        renderer.setViewport(0 - opticalCenterOffset, 0, halfWidth, height);
        renderer.setScissor(0, 0, halfWidth, height);
        renderer.setScissorTest(true);
        renderer.render(scene, camera);

        // Render Olho Direito (com deslocamento simétrico para casar com a lente direita)
        renderer.setViewport(halfWidth + opticalCenterOffset, 0, halfWidth, height);
        renderer.setScissor(halfWidth, 0, halfWidth, height);
        renderer.setScissorTest(true);
        renderer.render(scene, camera);
      } else {
        renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
        renderer.setScissorTest(false);
        renderer.render(scene, camera);
      }
    }

    startBtn.addEventListener('click', () => {
      isVR = true;
      uiOverlay.style.display = 'none';
      dividerLine.style.display = 'block';
      vrControls.style.display = 'flex';
      calibGuide.style.display = 'block';

      setTimeout(() => { calibGuide.style.display = 'none'; }, 6000);

      video.play().catch(e => console.log("Play error:", e));
      requestMotionPermission();

      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else if (document.documentElement.webkitRequestFullscreen) {
        document.documentElement.webkitRequestFullscreen();
      }

      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
    });

    init();
    animate();
  </script>
</body>
</html>
